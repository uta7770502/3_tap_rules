<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競技ルール詳細</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fff9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17202a;padding-bottom:70px}.top{background:#111;color:white;padding:22px 20px}.wrap{max-width:720px;margin:auto;padding:20px}.back{color:#087f5b;text-decoration:none;font-weight:700}.badge{display:inline-block;background:#e7f7f1;color:#087f5b;border-radius:15px;padding:6px 10px;font-size:12px;font-weight:800;margin-top:18px}h1{font-size:27px;margin:10px 0 18px}.sec{background:white;border-radius:18px;padding:18px;margin:12px 0;border-left:6px solid #0a8a63;box-shadow:0 3px 12px #00000008}.sec h2{font-size:18px;color:#087f5b;margin:0 0 9px}.sec p{margin:0;line-height:1.75}.pen{border-left-color:#111}.pen h2{color:#111}.quick{background:#111;color:#fff;border-radius:18px;padding:18px;margin:14px 0}.quick .penalty{font-size:25px;font-weight:900;margin:0 0 8px}.quick .do{font-size:15px;line-height:1.6}.quick .rule-ref{display:inline-block;margin-top:10px;background:#fff;color:#111;border-radius:12px;padding:5px 9px;font-size:12px;font-weight:900}.source{font-size:12px;color:#777;margin-top:18px;line-height:1.6}</style><link rel="stylesheet" href="assets/rule-guides.css?v=20261014-recovery1"><script src="assets/rule-guide-details.js?v=20260923-formal4"></script><script src="assets/scene-guides.js?v=20261125-case-reference-fix"></script><script src="assets/rule-guides.js?v=20261111-final-club-review"></script></head><body><div class="top">3タップゴルフ / COMPETITION</div><main class="wrap"><a class="back" href="competition_rules.html">← 競技ルール一覧</a><div id="content"></div></main><script>
const rawId=new URLSearchParams(location.search).get("id");
const id=rawId!==null&&/^[1-9]\d*$/.test(rawId)?Number(rawId):NaN;
const content=document.getElementById("content");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ruleLabel=r=>/^\d/.test(String(r))?"Rule ":"";
const officialRule=r=>String(r??"").match(/^(?:Rule\s*)?(\d{1,2})(?=[.\s/]|$)/i)?.[1];
if(!Number.isSafeInteger(id)||id<=0){content.textContent="競技ルールの指定が正しくありません。";}else{
const sources=["competition_rules.json","competition_rule25_verified_cases.json","competition_rules_extra_5_10.json","competition_rules_extra_13_17.json","competition_rules_extra_20.json"];
Promise.allSettled(sources.map(name=>fetch(name+"?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json();})))
.then(results=>{const failed=[];const datasets=results.map((result,i)=>{if(result.status==="fulfilled"&&Array.isArray(result.value))return result.value;failed.push(sources[i]);console.warn("Competition detail source unavailable:",sources[i]);return [];});
  if(failed.length){throw Error("Incomplete competition detail sources: "+failed.join(", "));}
  const [base,extra,extra2,extra3,extra4]=datasets;
  const validCase=v=>v&&typeof v==="object"&&!Array.isArray(v)&&((typeof v.id==="number"&&Number.isSafeInteger(v.id)&&v.id>0)||(typeof v.id==="string"&&/^[1-9]\d*$/.test(v.id)&&Number.isSafeInteger(Number(v.id))));
  if(!datasets.some(group=>group.some(validCase)))throw Error("No valid competition detail cases available");
  const a=base.concat(extra,extra2,extra3,extra4);
  const validIds=a.filter(validCase).map(v=>Number(v.id));
  const uniqueIds=new Set(validIds);
  if(a.length!==444||validIds.length!==444||uniqueIds.size!==444||Array.from({length:444},(_,i)=>i+1).some(n=>!uniqueIds.has(n))){
    throw Error("Competition detail ID integrity failed: total="+a.length+", valid="+validIds.length+", unique="+uniqueIds.size);
  }
  const x=a.find(v=>v&&typeof v==="object"&&!Array.isArray(v)&&((typeof v.id==="number"&&Number.isSafeInteger(v.id)&&v.id>0)||(typeof v.id==="string"&&/^[1-9]\d*$/.test(v.id)&&Number.isSafeInteger(Number(v.id))))&&Number(v.id)===id);
  if(!x){const message=document.createElement("p");message.setAttribute("role","alert");message.textContent="指定された競技ルールが見つかりません。";const retry=document.createElement("button");retry.type="button";retry.textContent="再読み込み";retry.onclick=()=>location.reload();content.append(message,retry);return;}
  document.title=x.title+"｜競技ルール";
  const ref=officialRule(x.rule);
  const allowedSource=typeof x.source==="string"&&/^https:\/\/(?:[a-z0-9-]+\.)*(?:randa\.org|usga\.org|jga\.or\.jp)\//i.test(x.source);
  const officialSource=allowedSource?'<p class="source"><a href="'+esc(x.source)+'" target="_blank" rel="noopener noreferrer">公式規則の参照元を開く ↗</a></p>':"";
  const subruleIds=[...new Set((Array.isArray(x.officialSubruleIds)?x.officialSubruleIds:[]).filter(v=>typeof v==="string"&&/^(?:(?:[1-9]|1\d|2[0-5])(?:\.\d+[a-z]?(?:\([a-z0-9]+\))*)?(?:\/\d+)?|[A-Za-z-]+\/\d+)$/.test(v)))];
  const subruleLinks=subruleIds.length?'<section class="sec"><h2>関連する公式規則・詳説</h2><p>'+subruleIds.map(v=>{const tab=v.includes('/')?(/^\d/.test(v)?'clarifications':'definitionClarifications'):'ruleSubrules';return '<a href="competition_official_index.html?tab='+tab+(v.includes('/')?'&id=':'&q=')+encodeURIComponent(v.includes('/')?v:v.replace(/\([a-z0-9]+\)/g,''))+'">'+esc(v)+'</a>';}).join(' ・ ')+'</p></section>':"";
  const sourceLink=ref?'<p class="source"><a href="competition_official_index.html?tab=ruleSubrules&q='+encodeURIComponent(ref+'.')+'">Rule '+esc(ref)+' の公式サブルール索引を確認する</a></p>':"";
  const detail=document.createElement("div");detail.innerHTML=`<div class="badge">${esc(ruleLabel(x.rule))}${esc(x.rule)} ・ ${esc(x.category||x.cat||"")}</div><h1>${esc(x.title)}</h1><section class="quick"><div class="penalty">${esc(x.penalty||"罰は個別条件を確認")}</div><div class="do"><b>結局どうする？</b> ${esc(x.action||x.procedure||"")}</div><span class="rule-ref">${esc(ruleLabel(x.rule))}${esc(x.rule)}</span></section><section class="sec"><h2>競技での判断</h2><p>${esc(x.summary||x.description||"")}</p></section><section class="sec"><h2>3タップ処置</h2><p>${esc(x.action||x.procedure||"")}</p></section><section id="dropGuide" class="sec rule-guide" hidden></section><section class="sec pen"><h2>罰・注意点</h2><p>${esc(x.penalty||"個別条件を確認")}</p></section>${subruleLinks}${sourceLink}${officialSource}<p class="source">競技固有のローカルルール・競技の条件を確認してください。規則問題の裁定はその競技の委員会が行います。</p>`;content.append(detail);
  if(window.RuleGuides&&typeof RuleGuides.render==="function"){
    try{RuleGuides.render(document.getElementById("dropGuide"),x,"competition");}
    catch(error){console.error("Competition drop guide rendering failed",error);const guide=document.getElementById("dropGuide");if(guide){guide.replaceChildren();guide.hidden=true;}const notice=document.createElement("p");notice.className="source";notice.setAttribute("role","status");notice.textContent="補助図解を表示できませんでした。上記の競技ルール本文と処置を確認してください。";detail.append(notice);}
  }
}).catch(()=>{content.replaceChildren();const message=document.createElement("p");message.setAttribute("role","alert");message.textContent="競技ルールを読み込めませんでした。通信状況を確認してください。";const retry=document.createElement("button");retry.type="button";retry.textContent="再読み込み";retry.onclick=()=>location.reload();content.append(message,retry);});
}
</script></body></html>
