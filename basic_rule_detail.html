<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>基本ルール詳細 | 3タップルールズ</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body{font-family:"Helvetica","Arial",sans-serif;background:#f9fff9;margin:0;padding-bottom:80px;color:#222}header{background:#00bfa5;color:#fff;text-align:center;padding:16px 10px;font-size:22px;font-weight:bold;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:0 6px 18px rgba(0,0,0,.10);line-height:1.25}.wrap{width:92%;max-width:680px;margin:14px auto 110px}.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:14px;margin:12px 0;line-height:1.6}.title{font-size:18px;font-weight:800;margin:4px 0 8px}.secTitle{font-size:14px;font-weight:900;color:#00997f;margin:0 0 6px;display:flex;align-items:center;gap:8px}.secText{font-size:14px;margin:0;white-space:pre-wrap}.irohaVisual{padding:0;overflow:hidden}.irohaVisual img{display:block;width:100%;height:auto;max-height:440px;object-fit:contain;background:#eef8ef}.visualCaption{padding:11px 14px 13px;font-size:13px;line-height:1.55;font-weight:800;color:#245d52;background:#f3fffb}.navRow{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}.navBtn{flex:1 1 140px;text-align:center;background:#00bfa5;color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:12px 10px;box-shadow:0 5px 12px rgba(0,0,0,.12)}.navBtn.light{background:#fff;color:#00bfa5;border:1px solid #cfeee7}.navBtn.disabled{opacity:.45;pointer-events:none}.bottom-nav{position:fixed;left:0;bottom:0;width:100%;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;height:70px;box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:1000}.bottom-nav img{width:50px;height:auto;display:block}.actions{display:flex;justify-content:center;margin:12px 0 6px}.actions a{text-decoration:none}.actions .btn.list{display:inline-block}@media(max-width:430px){.irohaVisual img{max-height:320px}.visualCaption{font-size:12px}}
  </style>
<script src="assets/scene-guides.js?v=20261005-dedicated2"></script>
</head>
<body>
  <header id="pageHeader">基本ルール詳細</header>
  <div class="wrap">
    <div class="actions"><a class="btn list" href="basic_rules.html">「いろは」トップへ</a></div>
    <div id="content"></div>
    <div class="navRow"><a id="prevBtn" class="navBtn light" href="#">← 前へ</a><a id="nextBtn" class="navBtn light" href="#">次へ →</a></div>
  </div>
  <nav class="bottom-nav"><a href="index.html"><img src="home-icon.png" alt="ホーム" /></a><a href="rules.html"><img src="book-icon.png" alt="ルール一覧" /></a><a href="favorites.html"><img src="star-icon.png" alt="お気に入り" /></a></nav>
  <script>
    function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
    function getId(){const p=new URLSearchParams(location.search);const id=Number(p.get("id"));return Number.isFinite(id)?id:NaN}
    const IROHA_VISUALS=[
      {keys:["ティーイングエリア","ティーショット","ティーから"],src:"assets/minimal-guides/tee-area-hd.png",caption:"ティーイングエリアと打つ位置をイメージで確認"},
      {keys:["OB","アウトオブバウンズ","白杭"],src:"assets/minimal-guides/ob-boundary-hd.png",caption:"白杭とOB境界の位置関係を確認"},
      {keys:["カート道","動かせない障害物"],src:"assets/minimal-guides/cart-stance-hd.png",caption:"カート道がスタンスやスイングにかかる場面を確認"},
      {keys:["バンカー"],src:"assets/minimal-guides/bunker-hd.png",caption:"バンカーでの基本的な状況をイメージで確認"},
      {keys:["ドロップ","救済エリア"],src:"assets/minimal-guides/drop-hd.png",caption:"救済時は膝の高さから正しくドロップ"},
      {keys:["リプレース","元の位置に戻"],src:"assets/minimal-guides/replace-action-hd.png",caption:"球を元の位置へ戻すリプレースを確認"},
      {keys:["地面にくい込","埋まった球"],src:"assets/minimal-guides/embedded-hd.png",caption:"地面にくい込んだ球の状態を確認"},
      {keys:["ペナルティーエリア","赤杭","黄杭"],src:"assets/minimal-guides/red-hd.png",caption:"ペナルティーエリア周辺の状況をイメージで確認"}
    ];
    const IROHA_ITEM_VISUALS={
      61:{src:"assets/minimal-guides/fairway-rough-v1.png",caption:"短く刈られたフェアウェイと、芝の長いラフ。球の見え方や打ちやすさが変わります"},
      63:{src:"assets/minimal-guides/green-v1.png",caption:"カップのある、短く整えられたグリーン。ここでは主にパターを使います"},
      66:{src:"assets/minimal-guides/playing-four-v1.png",caption:"前進4打の特設エリアの一例。利用条件・打数・球の置き方は、コースの掲示を確認"},
      82:{src:"assets/minimal-guides/putting-etiquette-v1.png",caption:"他の人の球とカップの間を避けて移動。相手が打つときは立ち止まって待とう"},
      83:{src:"assets/minimal-guides/ballmark-finish-v1.png",caption:"図は修復の仕上げ。周囲から中心へ芝を寄せた後、パターの底で軽く平らにならします"},
      84:{src:"assets/minimal-guides/divot-sand-v1.png",caption:"打ち終えた跡に目土を入れる例。盛り上げず平らにし、修復方法はコースの案内を優先"},
      65:{src:"assets/minimal-guides/red-hd.png",caption:"赤い杭で示されたペナルティエリアの例。黄杭とは救済の選択肢が異なります"},
      20:{src:"assets/minimal-guides/preparation-v1.png",caption:"前日にボール・ティー・グローブ・マーカーなどの持ち物を確認"},
      21:{src:"assets/minimal-guides/dress-v1.png",caption:"服装の一例。予約したゴルフ場のドレスコードを優先して確認しよう"},
      23:{src:"assets/minimal-guides/preparation-v1.png",caption:"出発前にクラブ・シューズ・小物の忘れ物を最終チェック"},
      40:{src:"assets/minimal-guides/preparation-v1.png",caption:"前日のうちに道具をそろえて、当日は慌てず出発"},
      43:{src:"assets/minimal-guides/warmup-v1.png",caption:"スタート前は無理のない範囲で体をほぐし、練習で疲れすぎないようにしよう"},
      80:{src:"assets/minimal-guides/safety-wait-v1.png",caption:"前方に人がいる間は打たずに待つ。安全を確認してからプレー"},
      81:{src:"assets/minimal-guides/ready-clubs-v1.png",caption:"使いそうなクラブを数本持って球の所へ。カートとの往復を減らそう"}
    };
    function visualFor(r){return IROHA_ITEM_VISUALS[r.id]||IROHA_VISUALS.find(v=>v.keys.some(k=>String(r.title||"").includes(k)))||(typeof RuleScenes!=="undefined"?RuleScenes.select(r,"basic"):null)}
    document.addEventListener("DOMContentLoaded",async()=>{const id=getId(),headerEl=document.getElementById("pageHeader"),contentEl=document.getElementById("content"),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn");if(!Number.isFinite(id)){contentEl.innerHTML='<div class="card"><div class="title">ページの開き方が違います</div><p class="secText">基本ルール一覧から開いてください。</p></div>';prevBtn.classList.add("disabled");nextBtn.classList.add("disabled");return}let rules=[];try{const res=await fetch("basic_rules.json?v=20260930-minimal-a1",{cache:"no-store"});rules=await res.json()}catch(e){contentEl.innerHTML='<div class="card"><div class="title">読み込みエラー</div><p class="secText">basic_rules.json を読み込めませんでした。</p></div>';return}rules=Array.isArray(rules)?rules:[];rules.sort((a,b)=>(a.id??0)-(b.id??0));const idx=rules.findIndex(r=>Number(r.id)===id);if(idx===-1){contentEl.innerHTML='<div class="card"><div class="title">そのIDの基本ルールが見つかりません</div></div>';return}const r=rules[idx],title=esc(r.title||"基本ルール"),blocks=[];headerEl.textContent=`コースデビュー「いろは」｜${r.title??"基本ルール"}`;if(r.description)blocks.push(`<div class="card"><div class="title">${title}</div><p class="secText">${esc(r.description)}</p></div>`);const visual=visualFor(r);if(visual)blocks.push(`<div class="card irohaVisual"><img src="${visual.src}?v=20261005-dedicated2" alt="${title}の説明イラスト" loading="eager" decoding="async"><div class="visualCaption">🎨 ${esc(visual.caption)}</div></div>`);if(r.detail)blocks.push(`<div class="card"><div class="secTitle">📌 まず知っておこう</div><p class="secText">${esc(r.detail)}</p></div>`);if(r.procedure)blocks.push(`<div class="card"><div class="secTitle">🧭 初心者はこう動けばOK</div><p class="secText">${esc(r.procedure)}</p></div>`);if(r.penalty)blocks.push(`<div class="card"><div class="secTitle">⚠️ ここに注意</div><p class="secText">${esc(r.penalty)}</p></div>`);contentEl.innerHTML=blocks.join("");const prev=rules[idx-1],next=rules[idx+1];if(prev){prevBtn.href=`basic_rule_detail.html?id=${encodeURIComponent(prev.id)}`;prevBtn.textContent=`← 前へ（${prev.title??"前"}）`}else prevBtn.classList.add("disabled");if(next){nextBtn.href=`basic_rule_detail.html?id=${encodeURIComponent(next.id)}`;nextBtn.textContent=`次へ（${next.title??"次"}） →`}else nextBtn.classList.add("disabled")});
  </script>
</body>
</html>
