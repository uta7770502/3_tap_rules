<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今すぐ裁定</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fff9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.head{background:#111;color:#fff;padding:26px 20px;border-radius:0 0 28px 28px}.wrap{padding:20px;max-width:720px;margin:auto}.back{color:#087f5b;text-decoration:none;font-weight:700}.step{font-size:12px;color:#087f5b;font-weight:800;margin-top:25px}h1{font-size:25px}.choices{display:grid;gap:11px}.choices button{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;text-align:left;font-size:16px;font-weight:750}.result{background:#fff;border-left:6px solid #0a8a63;border-radius:18px;padding:18px;line-height:1.7}.result b{color:#087f5b}.reset{margin-top:15px;border:0;background:#111;color:#fff;padding:13px 18px;border-radius:20px;font-weight:700}</style></head><body><div class="head"><b>3タップ裁定</b><div>状況を選んで処置へ</div></div><main class="wrap"><a class="back" href="competition.html">← 競技ゴルファー向け</a><div id="app"></div></main><script>
const flows={start:{q:"何が起きましたか？",a:[["球が動いた","moved"],["OB・球が見つからない","ob"],["救済を受けたい","relief"],["違う球を打った","wrong"],["処置が分からない","unknown"]]},
moved:{q:"どの状況で動きましたか？",a:[["捜索中に偶然","search"],["グリーン上で偶然","green"],["それ以外で自分が動かした","self"]]},
ob:{q:"どの状況ですか？",a:[["OBの可能性があり、まだ元の場所付近","provisional"],["OBまたは紛失が確定","lost"]]},
relief:{q:"どこからの救済ですか？",a:[["カート道・修理地など","abnormal"],["赤杭・黄杭・池","penalty"],["打てないのでアンプレヤブル","unplayable"]]},
wrong:{result:"<b>誤球：規則6.3c</b><br>ストロークプレーでは一般の罰（2罰打）。誤りを訂正して自分の正しい球をプレーします。誤球へのストローク自体はスコアに数えません。"},
unknown:{result:"<b>処置が分からない：規則20.1c</b><br>ストロークプレーでは、要件を満たせば2つの球でホールを終え、スコア提出前に委員会へ報告する方法があります。自己判断で終わらせず委員会へ。"},
search:{result:"<b>捜索中の偶然の移動：規則7.4</b><br>罰なし。球を元の箇所にリプレースします。"},
green:{result:"<b>グリーン上で偶然動かした場合</b><br>通常は罰なしで元の箇所にリプレースします。状況に応じて規則9・13を確認してください。"},
self:{result:"<b>自分が球を動かした：規則9.4</b><br>例外を除き通常1罰打。球は元の箇所へリプレースします。"},
provisional:{result:"<b>暫定球：規則18.3</b><br>ペナルティーエリア以外で紛失またはOBの可能性があるなら、暫定球であることを明確にしてプレーできます。"},
lost:{result:"<b>OB・紛失：規則18.2</b><br>原則1罰打を加え、直前のストロークを行った場所からプレーします。採用されたローカルルールがあれば併せて確認。"},
abnormal:{result:"<b>異常なコース状態：規則16.1</b><br>無罰救済が認められる場合、完全救済のニヤレストポイントを決め、規定の救済エリアへドロップします。"},
penalty:{result:"<b>ペナルティーエリア：規則17.1</b><br>1罰打の救済。最後に境界を横切った地点を確認し、赤・黄それぞれで認められる方法から選択します。"},
unplayable:{result:"<b>アンプレヤブル：規則19</b><br>1罰打。ペナルティーエリア以外で、ストロークと距離・後方線上・ラテラル救済から選びます。"}};
let key="start";function render(){const x=flows[key],el=document.getElementById("app");if(x.result){el.innerHTML='<div class="step">3 / 3　処置</div><h1>裁定の目安</h1><div class="result">'+x.result+'</div><button class="reset" onclick="key=\'start\';render()">最初から</button>';return}el.innerHTML='<div class="step">状況を選択</div><h1>'+x.q+'</h1><div class="choices">'+x.a.map(v=>'<button onclick="key=\''+v[1]+'\';render()">'+v[0]+' →</button>').join("")+'</div>'}render();</script></body></html>
