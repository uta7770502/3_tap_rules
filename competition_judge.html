<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今すぐ裁定</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fff9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.head{background:#111;color:#fff;padding:26px 20px;border-radius:0 0 28px 28px}.wrap{padding:20px;max-width:720px;margin:auto}.back{color:#087f5b;text-decoration:none;font-weight:700}.step{font-size:12px;color:#087f5b;font-weight:800;margin-top:25px}h1{font-size:25px}.choices{display:grid;gap:11px}.choices button{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;text-align:left;font-size:16px;font-weight:750}.result{background:#fff;border-left:6px solid #0a8a63;border-radius:18px;padding:18px;line-height:1.7}.result b{color:#087f5b}.decision{font-size:24px;font-weight:900;color:#111;margin-bottom:8px}.next{margin-top:10px;padding-top:10px;border-top:1px solid #e3e8e5}.source{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;color:#087f5b;background:#e9f6f1;border-radius:12px;padding:5px 8px}.reset{margin-top:15px;border:0;background:#111;color:#fff;padding:13px 18px;border-radius:20px;font-weight:700}</style></head><body><div class="head"><b>3タップ裁定</b><div>状況を選んで処置へ</div></div><main class="wrap"><a class="back" href="competition.html">← 競技ゴルファー向け</a><div id="app"></div></main><script>
const flows={start:{q:"何が起きましたか？",a:[["球が動いた","moved"],["OB・球が見つからない","ob"],["救済を受けたい","relief"],["違う球を打った","wrong"],["処置が分からない","unknown"]]},
moved:{q:"どの状況で動きましたか？",a:[["捜索中に偶然","search"],["グリーン上で偶然","green"],["それ以外で自分が動かした","self"]]},
ob:{q:"どの状況ですか？",a:[["OBの可能性があり、まだ元の場所付近","provisional"],["OBまたは紛失が確定","lost"]]},
relief:{q:"どこからの救済ですか？",a:[["カート道・修理地など","abnormal"],["赤杭・黄杭・池","penalty"],["打てないのでアンプレヤブル","unplayable"]]},
wrong:{result:"<div class=\"decision\">一般の罰（ストロークプレーは2罰打）</div><b>誤球をプレーした</b><div class=\"next\">次にすること：自分の正しい球をプレーして誤りを訂正します。誤球へのストロークはスコアに数えません。</div><span class=\"source\">根拠：Rule 6.3c</span>"},
unknown:{result:"<div class=\"decision\">まず罰を確定しない</div><b>処置に迷った</b><div class=\"next\">次にすること：ストロークプレーでは要件を満たせば2つの球でホールを終え、スコア提出前に委員会へ報告します。</div><span class=\"source\">根拠：Rule 20.1c</span>"},
search:{result:"<div class="decision">罰なし</div><b>捜索中に偶然、球を動かした</b><div class="next">次にすること：球を元の箇所にリプレースします。</div><span class="source">根拠：Rule 7.4</span>"},
green:{result:"<div class=\"decision\">通常は罰なし</div><b>グリーン上で偶然、球を動かした</b><div class=\"next\">次にすること：球を元の箇所へリプレースします。</div><span class=\"source\">根拠：Rule 13.1d</span>"},
self:{result:"<div class="decision">通常 1罰打</div><b>自分が球を動かした</b><div class="next">次にすること：例外に該当しなければ、球を元の箇所へリプレースします。</div><span class="source">根拠：Rule 9.4</span>"},
provisional:{result:"<div class=\"decision\">暫定球をプレー可能</div><b>OB・紛失の可能性がある</b><div class=\"next\">次にすること：ペナルティーエリア以外で紛失またはOBの可能性があるなら、ストローク前に誰かへ「暫定球」と明確に告げてからプレーします。</div><span class=\"source\">根拠：Rule 18.3</span>"},
lost:{result:"<div class="decision">1罰打</div><b>OB・紛失球</b><div class="next">次にすること：原則として直前のストロークを行った場所からプレーします。競技で採用されたローカルルールも確認してください。</div><span class="source">根拠：Rule 18.2</span>"},
abnormal:{result:"<div class=\"decision\">無罰救済の場合あり</div><b>カート道・修理地など</b><div class=\"next\">次にすること：ペナルティーエリア外で救済が認められる場合は、完全な救済のニヤレストポイントを決め、規定の救済エリアへドロップします。</div><span class=\"source\">根拠：Rule 16.1</span>"},
penalty:{result:"<div class="decision">1罰打</div><b>ペナルティーエリア</b><div class="next">次にすること：最後に境界を横切った地点を確認し、赤・黄それぞれで認められる救済方法から選びます。</div><span class="source">根拠：Rule 17.1</span>"},
unplayable:{result:"<div class="decision">1罰打</div><b>アンプレヤブル</b><div class="next">次にすること：ペナルティーエリア以外で、ストロークと距離・後方線上・ラテラル救済から選びます。</div><span class="source">根拠：Rule 19</span>"}};
let key="start";function render(){const x=flows[key],el=document.getElementById("app");if(x.result){el.innerHTML='<div class="step">3 / 3　処置</div><h1>裁定の目安</h1><div class="result">'+x.result+'</div><button class="reset" onclick="key=\'start\';render()">最初から</button>';return}el.innerHTML='<div class="step">状況を選択</div><h1>'+x.q+'</h1><div class="choices">'+x.a.map(v=>'<button onclick="key=\''+v[1]+'\';render()">'+v[0]+' →</button>').join("")+'</div>'}render();</script></body></html>
