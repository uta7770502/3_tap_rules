<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式ルール索引</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fff9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17202a}.top{background:#111;color:#fff;padding:24px 20px}.wrap{max-width:720px;margin:auto;padding:20px}.back{color:#087f5b;text-decoration:none;font-weight:800}.note{font-size:13px;line-height:1.65;color:#59635f;margin:15px 0}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{border:0;border-radius:18px;padding:10px 14px;font-weight:800}.tabs .on{background:#087f5b;color:#fff}.item{background:#fff;border:1px solid #e1e9e5;border-radius:15px;padding:14px;margin:8px 0}.item small{color:#087f5b;font-weight:800}.item b{display:block;margin-top:4px}</style></head><body><div class="top"><b>公式ルール索引</b><div style="font-size:12px;opacity:.7;margin-top:5px">R&A公式構造との網羅性確認用</div></div><main class="wrap"><a class="back" href="competition_rules.html">← 競技ルール一覧</a><p class="note">ケース検索とは別に、公式項目そのものを一覧化しています。ケースが似ていても公式項目は統合せず、漏れを確認できる構造です。</p><div class="tabs"><button data-k="definitions" class="on">定義</button><button data-k="committeeProcedures">委員会手続</button><button data-k="modelLocalRules">MLR</button></div><input id="oq" placeholder="公式項目を検索…" style="width:100%;padding:14px 16px;border:1px solid #ccd8d2;border-radius:22px;margin:0 0 12px;font-size:16px"><div id="count"></div><div id="list"></div></main><script>let d={},key="definitions";const list=document.getElementById("list"),count=document.getElementById("count");function draw(){const v=document.getElementById("oq").value.trim().toLowerCase();const all=d[key]||[],a=all.filter(x=>!v||(x.id+" "+x.title).toLowerCase().includes(v));count.textContent=a.length+"項目 / 全"+all.length+"項目";list.innerHTML=a.map(x=>'<div class="item"><small>'+x.id+'</small><b>'+x.title+'</b></div>').join("")}fetch("competition_official_index.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(x=>{d=x;draw()});document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{key=b.dataset.k;document.querySelectorAll("[data-k]").forEach(x=>x.classList.remove("on"));b.classList.add("on");draw()});document.getElementById("oq").oninput=draw;</script></body></html>
