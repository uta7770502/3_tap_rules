<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ルール一覧 | 3タップルールズ</title>
  <style>
    body {
      background: #f9fff9;
      font-family: "Helvetica", sans-serif;
      margin: 0;
      padding-bottom: 90px;
      -webkit-text-size-adjust: 100%;
    }
    header {
      background: #00bfa5;
      color: #fff;
      text-align: center;
      padding: 16px 0;
      font-size: 24px;
      font-weight: bold;
      border-bottom-left-radius: 25px;
      border-bottom-right-radius: 25px;
    }
    .back-btn {
      display: block;
      width: 220px;
      text-align: center;
      background: #FFD84D;
      color: #333;
      text-decoration: none;
      margin: 20px auto;
      font-weight: bold;
      padding: 10px 0;
      border-radius: 40px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
      transition: 0.2s;
    }
    .back-btn:hover {
      background: #ffcc33;
      transform: translateY(-2px);
    }
    #searchArea {
      text-align: center;
      margin: 10px auto 20px;
    }
    #searchInput {
      width: 80%;
      max-width: 400px;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 25px;
      border: 1px solid #ccc;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      outline: none;
    }
    #rules-list {
      padding: 0 20px;
    }
    .rule-card {
      display: block;
      width: 90%;
      max-width: 500px;
      margin: 10px auto;
      padding: 14px 0;
      text-align: center;
      background: #fff;
      color: #333;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .rule-card:hover {
      background: #eaf9e6;
      transform: translateY(-2px);
    }
    .bottom-nav {
      position: fixed;
      left: 0; bottom: 0;
      width: 100%;
      background: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 70px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
      z-index: 1000;
    }
    .bottom-nav img {
      width: 50px;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>
  <header>ルール一覧</header>

  <a href="index.html" class="back-btn">トップへ戻る</a>

  <div id="searchArea">
    <input id="searchInput" type="text" placeholder="ルールを検索..." />
  </div>

  <main id="rules-list"></main>

  <nav class="bottom-nav">
    <a href="index.html"><img src="home-icon.png" alt="ホーム" /></a>
    <a href="rules.html"><img src="book-icon.png" alt="ルール一覧" /></a>
    <a href="favorites.html"><img src="star-icon.png" alt="お気に入り" /></a>
  </nav>

  <script>
document.addEventListener("DOMContentLoaded", async () => {
  const listContainer = document.getElementById("rules-list");
  const searchInput = document.getElementById("searchInput");

  // 🧩 正規化処理
  const normalize = (s = "") =>
    s.toLowerCase()
      .replace(/\s|　/g, "")
      .replace(/[－―—–]/g, "-")
      .replace(/フェアウエイ|フェアウエー/g, "フェアウェイ")
      .replace(/ティーイング?エリア/g, "ティー")
      .replace(/グリーン上|パッティンググリーン/g, "グリーン")
      .replace(/ペナ(ルティ)?エリア|ハザード/g, "ペナルティエリア")
      .replace(/赤杭|ラテラル/g, "赤杭")
      .replace(/黄杭|黄色杭|黄線/g, "黄杭")
      .replace(/赤杭|赤色杭|赤線|ラテラル/g, "赤杭")
      .replace(/白杭|ob杭|アウトオブバウンズ/g, "白杭")
      .replace(/青杭|青線|gur/g, "修理地")
      .replace(/アンプレ(ヤブル)?/g, "アンプレ")
      .replace(/救済/g, "救済");

  // 🧩 同義語・関連語展開
  const expand = (kw) => {
    const n = normalize(kw);
    const set = new Set([n]);

    // 場所
    if (n.includes("ティー")) set.add("ティーイングエリア");
    if (n.includes("フェアウェイ")) set.add("フェアウエイ").add("フェアウエー");
    if (n.includes("ラフ")) set.add("セミラフ").add("ラフ地帯");
    if (n.includes("バンカー")) set.add("砂地").add("バンカ―");
    if (n.includes("グリーン")) set.add("グリーン上").add("パッティンググリーン");

    // 種類
    if (n.includes("基本ルール")) set.add("一般規則").add("基本的なルール");
    if (n.includes("ローカル")) set.add("ローカルルール").add("特設ティー");
    if (n.includes("コンペ")) set.add("コンペルール").add("競技ルール").add("スコア集計");
    if (n.includes("マナー")) set.add("マナー・エチケット").add("エチケット");
    if (n.includes("クラブ")) set.add("クラブ規則").add("用具");

    return Array.from(set);
  };

  // 通常検索は「ルール名＋明示キーワード」のみ。本文中の偶然の一致は拾わない。
  const packSearchTerms = (r) =>
    normalize(`${r.title || ""} ${(r.keywords || []).join(" ")}`);

  // 🟢 JSON 読み込み
  let rules = [];
  try {
    const res = await fetch("rules.json?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("fetch error");
    rules = await res.json();
  } catch (e) {
    console.error("❌ rules load error:", e);
    listContainer.innerHTML = "<p>ルールを読み込めませんでした。</p>";
    return;
  }

  // 🟢 URLパラメータ取得（q または category）
  const params = new URLSearchParams(location.search);
  const queryParam = (params.get("q") || "").trim();
  const categoryParam = (params.get("category") || "").trim();

  // 初回表示：カテゴリボタンはカテゴリ一致、文字検索はタイトル＋keywordsのみ。
  if (categoryParam) {
    searchInput.value = categoryParam;
    renderList(rules.filter(r => normalize(r.category || "") === normalize(categoryParam)));
  } else if (queryParam) {
    searchInput.value = queryParam;
    renderList(filterRules(rules, queryParam));
  } else {
    renderList(rules);
  }

  // 🔍 入力検索
  searchInput.addEventListener("input", () => {
    renderList(filterRules(rules, searchInput.value));
  });

  // 🔍 文字検索：タイトルと登録済みkeywordsに限定
  function filterRules(all, keyword = "") {
    const q = keyword.trim();
    if (!q) return all;

    const words = q.split(/[,、\s　]+/).filter(Boolean);
    const expandedBags = words.map(expand);

    return all.filter((r) => {
      const hay = packSearchTerms(r);
      // ✅ どれか1つでもマッチしたらOK
      return expandedBags.some((bag) => bag.some((key) => hay.includes(key)));
    });
  }

  // 🟩 一覧描画
  function renderList(list) {
    if (!list || !list.length) {
      listContainer.innerHTML = "<p>該当するルールがありません。</p>";
      return;
    }
    listContainer.innerHTML = list
      .map(
        (r) => `
        <button class="rule-card" onclick="location.href='rule.html?id=${r.id}'">
          ${r.title}
        </button>
      `
      )
      .join("");
  }
});
  </script>
</body>
</html>
