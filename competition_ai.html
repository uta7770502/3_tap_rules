<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI競技アシスタント PRO</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6faf7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;min-height:100vh}.head{background:#111;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px}.head small{opacity:.72}.head h1{font-size:21px;margin:5px 0}.pro{font-size:11px;background:#ffd84d;color:#111;border-radius:8px;padding:3px 6px}.wrap{max-width:720px;margin:auto;padding:18px 16px 120px}.intro{background:#fff;border-radius:20px;padding:17px;line-height:1.65;border:1px solid #e4e8e5}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.action{display:grid;grid-template-rows:36px 24px;place-items:center;align-content:center;text-align:center;line-height:1.2;padding:0 6px;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.08);border:0;border-radius:18px;background:#fff;min-height:91px;font-weight:800;font-size:15px;box-shadow:0 3px 12px #0001}.action-icon{display:flex;width:100%;height:36px;align-items:center;justify-content:center;font-size:28px;line-height:36px;margin:0;padding:0}.action-label{display:flex;width:100%;height:24px;align-items:center;justify-content:center;text-align:center;line-height:24px;margin:0;padding:0}.camera{background:#111;color:#fff}.preview{display:none;background:#fff;border-radius:20px;padding:12px;margin:12px 0;border:1px solid #ddd}.preview img{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:#eee}.preview-row{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px}.remove{border:0;background:#eee;border-radius:14px;padding:7px 10px}.chat{margin-top:15px}.bubble{max-width:90%;padding:13px 15px;border-radius:18px;margin:10px 0;line-height:1.55;font-size:15px}.ai{background:#fff;border:1px solid #e1e5e3}.me{background:#111;color:#fff;margin-left:auto}.answer{border-left:5px solid #0a8a63}.rule{font-size:12px;color:#087f5b;font-weight:800}.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.row{max-width:720px;margin:auto;display:flex;gap:7px}.input{flex:1;min-width:0;height:48px;border:1px solid #aaa;border-radius:25px;padding:0 15px;font-size:16px;background:#fff;color:#111;opacity:1;-webkit-text-fill-color:#111;pointer-events:auto;user-select:text;-webkit-user-select:text;touch-action:manipulation}.input::placeholder{color:#999;opacity:1}.send{height:48px;border:0;border-radius:24px;background:#0a8a63;color:#fff;padding:0 17px;font-weight:800}.hint{font-size:12px;color:#6b746f;margin:8px 3px}.photo-mark{display:inline-block;background:#ffd84d;color:#111;padding:3px 7px;border-radius:8px;font-size:11px;font-weight:800}</style><!-- deploy-trigger-20260922 -->
</head><body>
<header class="head"><small onclick="history.back()">← 競技ゴルファー向け</small><h1>AI競技アシスタント <span class="pro">PRO</span></h1><div style="font-size:12px;color:#b9f6df">● 写真・音声・テキストで状況確認</div></header>
<main class="wrap"><div class="intro"><b>その場の状況を見せてください。</b><br>写真を撮るか、話すだけ。必要な情報が足りなければAIが追加で質問し、処置・罰・根拠規則・次にすることを整理します。</div>
<div class="actions"><button type="button" class="action camera" id="camera"><span class="action-icon">📷</span><span class="action-label">その場で撮る</span></button><button type="button" class="action" id="mic"><span class="action-icon">🎙</span><span class="action-label">話す</span></button><button type="button" class="action" id="textBtn"><span class="action-icon">⌨️</span><span class="action-label">入力する</span></button></div>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<section class="preview" id="preview"><img id="previewImg" alt="撮影したコース状況"><div class="preview-row"><span><span class="photo-mark">PHOTO</span> この写真をAIに見せます</span><button class="remove" id="remove">撮り直す</button></div></section>
<div class="hint">例：カート道／赤杭・黄杭／バンカー／修理地／球の位置などが分かるように撮影してください。</div>
<p id="connection" class="hint" role="status">AIの接続状態を確認中…</p><button id="newChat" class="remove" type="button">新しい相談</button><section aria-live="polite" class="chat" id="chat"><div class="bubble ai">写真だけで判断できない場合は、「スタンスも道にかかる？」「杭は赤？黄？」など必要なことだけ質問します。</div></section></main>
<footer class="composer"><div class="row"><input class="input" id="input" type="text" inputmode="text" autocomplete="off" enterkeyhint="send" placeholder="写真の補足や状況を入力" aria-label="状況を入力"><button class="send" id="send">AIに聞く</button></div></footer>
<script src="assets/golf-chat.js?v=20260923-ai1" defer></script></body></html>
