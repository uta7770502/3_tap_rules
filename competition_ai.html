<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI競技アシスタント PRO</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6faf7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;min-height:100vh}.head{background:#111;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px}.head small{opacity:.72}.head h1{font-size:21px;margin:5px 0}.pro{font-size:11px;background:#ffd84d;color:#111;border-radius:8px;padding:3px 6px}.wrap{max-width:720px;margin:auto;padding:18px 16px 120px}.intro{background:#fff;border-radius:20px;padding:17px;line-height:1.65;border:1px solid #e4e8e5}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.action{border:0;border-radius:18px;background:#fff;min-height:91px;font-weight:800;font-size:15px;box-shadow:0 3px 12px #0001}.action b{display:block;font-size:28px;margin-bottom:4px}.camera{background:#111;color:#fff}.preview{display:none;background:#fff;border-radius:20px;padding:12px;margin:12px 0;border:1px solid #ddd}.preview img{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:#eee}.preview-row{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px}.remove{border:0;background:#eee;border-radius:14px;padding:7px 10px}.chat{margin-top:15px}.bubble{max-width:90%;padding:13px 15px;border-radius:18px;margin:10px 0;line-height:1.55;font-size:15px}.ai{background:#fff;border:1px solid #e1e5e3}.me{background:#111;color:#fff;margin-left:auto}.answer{border-left:5px solid #0a8a63}.rule{font-size:12px;color:#087f5b;font-weight:800}.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.row{max-width:720px;margin:auto;display:flex;gap:7px}.input{flex:1;min-width:0;border:1px solid #ccc;border-radius:25px;padding:0 15px;font-size:16px}.send{height:48px;border:0;border-radius:24px;background:#0a8a63;color:#fff;padding:0 17px;font-weight:800}.hint{font-size:12px;color:#6b746f;margin:8px 3px}.photo-mark{display:inline-block;background:#ffd84d;color:#111;padding:3px 7px;border-radius:8px;font-size:11px;font-weight:800}</style></head><body>
<header class="head"><small onclick="history.back()">← 競技ゴルファー向け</small><h1>AI競技アシスタント <span class="pro">PRO</span></h1><div style="font-size:12px;color:#b9f6df">● 写真・音声・テキストで状況確認</div></header>
<main class="wrap"><div class="intro"><b>その場の状況を見せてください。</b><br>写真を撮るか、話すだけ。必要な情報が足りなければAIが追加で質問し、処置・罰・根拠規則・次にすることを整理します。</div>
<div class="actions"><button class="action camera" id="camera"><b>📷</b>その場で撮る</button><button class="action" id="mic"><b>🎙</b>話す</button><button class="action" id="textBtn"><b>⌨️</b>入力する</button></div>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<section class="preview" id="preview"><img id="previewImg" alt="撮影したコース状況"><div class="preview-row"><span><span class="photo-mark">PHOTO</span> この写真をAIに見せます</span><button class="remove" id="remove">撮り直す</button></div></section>
<div class="hint">例：カート道／赤杭・黄杭／バンカー／修理地／球の位置などが分かるように撮影してください。</div>
<section class="chat" id="chat"><div class="bubble ai">写真だけで判断できない場合は、「スタンスも道にかかる？」「杭は赤？黄？」など必要なことだけ質問します。</div></section></main>
<footer class="composer"><div class="row"><input class="input" id="input" placeholder="写真の補足や状況を入力"><button class="send" id="send">AIに聞く</button></div></footer>
<script>
const photo=document.getElementById("photo"),preview=document.getElementById("preview"),img=document.getElementById("previewImg"),input=document.getElementById("input"),chat=document.getElementById("chat");let selected=null;
document.getElementById("camera").onclick=()=>{photo.value="";photo.click()};photo.onchange=()=>{const file=photo.files&&photo.files[0];if(!file){selected=null;preview.style.display="none";img.removeAttribute("src");input.focus();return}selected=file;img.src=URL.createObjectURL(file);preview.style.display="block";input.focus()};
document.getElementById("remove").onclick=()=>{selected=null;photo.value="";preview.style.display="none";img.removeAttribute("src")};
document.getElementById("textBtn").onclick=()=>input.focus();
document.getElementById("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("このブラウザではブラウザ音声入力が利用できません。キーボードのマイク入力も使えます。");return}const r=new SR();r.lang="ja-JP";r.interimResults=false;r.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};r.start()};
function bubble(html,cls){const d=document.createElement("div");d.className="bubble "+cls;d.innerHTML=html;chat.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"end"})}
function demoAnswer(text,hasPhoto){const t=(text||"").toLowerCase();let body;if(/池|赤杭|黄杭|ペナルティ/.test(t)){body='<div class="rule">規則17.1 / ペナルティーエリア</div><b>まず確認：</b>最後に球がペナルティーエリアの境界を横切った地点は分かりますか？ また杭・線は赤ですか、黄ですか？<br><br>救済を受ける場合は通常1罰打です。赤と黄では選べる救済方法が異なるため、この2点が分かれば次の処置を絞れます。'}else if(/ob|白杭|紛失|見つから/.test(t)){body='<div class="rule">規則18.2 / OB・紛失球</div><b>処置：</b>原則は1罰打を加え、直前のストロークを行った場所からプレーします。暫定球をプレーしている場合や、競技で特別なローカルルールが採用されている場合はその条件も確認します。'}else if(/カート|道路|修理地|水たまり/.test(t)){body='<div class="rule">規則16.1 / 異常なコース状態</div><b>確認：</b>球・スタンス・意図するスイング区域のどこが障害にかかっていますか？<br><br>救済対象なら、完全救済のニアレストポイントを基準に無罰救済を行います。'}else{body='<div class="rule">AI競技アシスタント</div><b>状況をもう少し確認します。</b><br>'+(hasPhoto?'写真と説明をもとに、':'入力内容をもとに、')+'「球がある場所」「何が起きたか」「杭や線の色」など、処置を決めるために必要な情報だけ追加してください。'}bubble(body,"ai answer")}
document.getElementById("send").onclick=()=>{const text=input.value.trim(),hasPhoto=!!selected;if(!text&&!hasPhoto){input.focus();return}bubble((hasPhoto?'<span class="photo-mark">写真あり</span> ':'')+(text||"この写真の状況を確認して"),"me");input.value="";setTimeout(()=>demoAnswer(text,hasPhoto),180)};
input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();document.getElementById("send").click()}});
</script></body></html>
