<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI競技アシスタント PRO</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6faf7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;min-height:100vh}.head{background:#111;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px}.head small{opacity:.72}.head h1{font-size:21px;margin:5px 0}.pro{font-size:11px;background:#ffd84d;color:#111;border-radius:8px;padding:3px 6px}.wrap{max-width:720px;margin:auto;padding:18px 16px 120px}.intro{background:#fff;border-radius:20px;padding:17px;line-height:1.65;border:1px solid #e4e8e5}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.action{border:0;border-radius:18px;background:#fff;min-height:91px;font-weight:800;font-size:15px;box-shadow:0 3px 12px #0001}.action b{display:block;font-size:28px;margin-bottom:4px}.camera{background:#111;color:#fff}.preview{display:none;background:#fff;border-radius:20px;padding:12px;margin:12px 0;border:1px solid #ddd}.preview img{width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:#eee}.preview-row{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px}.remove{border:0;background:#eee;border-radius:14px;padding:7px 10px}.chat{margin-top:15px}.bubble{max-width:90%;padding:13px 15px;border-radius:18px;margin:10px 0;line-height:1.55;font-size:15px}.ai{background:#fff;border:1px solid #e1e5e3}.me{background:#111;color:#fff;margin-left:auto}.answer{border-left:5px solid #0a8a63}.rule{font-size:12px;color:#087f5b;font-weight:800}.composer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.row{max-width:720px;margin:auto;display:flex;gap:7px}.input{flex:1;min-width:0;height:48px;border:1px solid #aaa;border-radius:25px;padding:0 15px;font-size:16px;background:#fff;color:#111;opacity:1;-webkit-text-fill-color:#111;pointer-events:auto;user-select:text;-webkit-user-select:text;touch-action:manipulation}.input::placeholder{color:#999;opacity:1}.send{height:48px;border:0;border-radius:24px;background:#0a8a63;color:#fff;padding:0 17px;font-weight:800}.hint{font-size:12px;color:#6b746f;margin:8px 3px}.photo-mark{display:inline-block;background:#ffd84d;color:#111;padding:3px 7px;border-radius:8px;font-size:11px;font-weight:800}</style></head><body>
<header class="head"><small onclick="history.back()">← 競技ゴルファー向け</small><h1>AI競技アシスタント <span class="pro">PRO</span></h1><div style="font-size:12px;color:#b9f6df">● 写真・音声・テキストで状況確認</div></header>
<main class="wrap"><div class="intro"><b>その場の状況を見せてください。</b><br>写真を撮るか、話すだけ。必要な情報が足りなければAIが追加で質問し、処置・罰・根拠規則・次にすることを整理します。</div>
<div class="actions"><button class="action camera" id="camera"><b>📷</b>その場で撮る</button><button class="action" id="mic"><b>🎙</b>話す</button><button class="action" id="textBtn"><b>⌨️</b>入力する</button></div>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<section class="preview" id="preview"><img id="previewImg" alt="撮影したコース状況"><div class="preview-row"><span><span class="photo-mark">PHOTO</span> この写真をAIに見せます</span><button class="remove" id="remove">撮り直す</button></div></section>
<div class="hint">例：カート道／赤杭・黄杭／バンカー／修理地／球の位置などが分かるように撮影してください。</div>
<section class="chat" id="chat"><div class="bubble ai">写真だけで判断できない場合は、「スタンスも道にかかる？」「杭は赤？黄？」など必要なことだけ質問します。</div></section></main>
<footer class="composer"><div class="row"><input class="input" id="input" type="text" inputmode="text" autocomplete="off" enterkeyhint="send" placeholder="写真の補足や状況を入力" aria-label="状況を入力"><button class="send" id="send">AIに聞く</button></div></footer>
<script>
let competitionRules=[];fetch("competition_rules.json?v=3",{cache:"no-store"}).then(r=>r.json()).then(d=>competitionRules=d).catch(()=>{});\nconst photo=document.getElementById("photo"),preview=document.getElementById("preview"),img=document.getElementById("previewImg"),input=document.getElementById("input"),chat=document.getElementById("chat");let selected=null;
document.getElementById("camera").onclick=()=>{photo.value="";photo.click()};photo.onchange=()=>{const file=photo.files&&photo.files[0];if(!file){selected=null;preview.style.display="none";img.removeAttribute("src");input.focus();return}selected=file;img.src=URL.createObjectURL(file);preview.style.display="block";input.focus()};
document.getElementById("remove").onclick=()=>{selected=null;photo.value="";preview.style.display="none";img.removeAttribute("src")};
input.disabled=false;input.readOnly=false;input.style.pointerEvents="auto";
document.getElementById("textBtn").onclick=()=>{
 input.disabled=false;
 input.removeAttribute("disabled");
 input.removeAttribute("readonly");
 input.style.pointerEvents="auto";
 input.focus({preventScroll:true});
 setTimeout(()=>{input.focus();input.click();input.scrollIntoView({behavior:"smooth",block:"center"});},50);
};
document.getElementById("mic").onclick=async()=>{
 const btn=document.getElementById("mic");
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
   alert("マイクを利用できません。iPhoneでは「設定 → Safari → マイク」または、このサイトの「Webサイトの設定 → マイク」を「許可」にしてください。");
   return;
  }
  btn.disabled=true; btn.innerHTML="<b>🎙</b>許可を確認中";
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  stream.getTracks().forEach(track=>track.stop());
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
   alert("マイクの許可は確認できました。このブラウザでは音声認識APIが利用できないため、iPhoneキーボードのマイク入力を使ってください。");
   input.focus(); return;
  }
  const r=new SR();r.lang="ja-JP";r.interimResults=false;r.continuous=false;
  r.onstart=()=>{btn.innerHTML="<b>🔴</b>聞いています"};
  r.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};
  r.onerror=e=>{
   if(e.error==="not-allowed"||e.error==="service-not-allowed") alert("マイクが許可されていません。Safariのアドレスバー左側のメニュー → Webサイトの設定 → マイク → 許可、を選んでから再度押してください。");
   else alert("音声入力を開始できませんでした。もう一度お試しください。");
  };
  r.onend=()=>{btn.disabled=false;btn.innerHTML="<b>🎙</b>話す"};
  r.start();
 }catch(e){
  btn.disabled=false;btn.innerHTML="<b>🎙</b>話す";
  if(e&&e.name==="NotAllowedError") alert("マイクが拒否されています。Safariのアドレスバー左側のメニュー → Webサイトの設定 → マイク → 許可、を選んでください。");
  else alert("マイクを開始できませんでした。SafariでHTTPSのページを開いているか確認してください。");
 }
};
function bubble(html,cls){const d=document.createElement("div");d.className="bubble "+cls;d.innerHTML=html;chat.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"end"})}
let context={topic:"",color:"",crossingKnown:false};
function updateContext(text){const t=text||"";if(/池|ペナルティ/.test(t))context.topic="penalty";if(/赤/.test(t))context.color="red";if(/黄/.test(t))context.color="yellow";if(/横切|越え|入った|落ちた/.test(t))context.crossingKnown=true}
function searchRules(text){
 const q=(text||"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/ゴルフボール|ボール/g,"球").replace(/二度打ち|2度打ち|二回当た|2回当た|ダブルヒット/g,"二度打ち 2度打ち ダブルヒット 偶然").replace(/真っ二つ|粉々|バラバラ/g,"複数片 破片").replace(/割れた|割れ|壊れた|壊れ/g,"切れ ひび 損傷").replace(/違うコース|違うホール/g,"違うホール ティーイングエリア").replace(/池|ウォーターハザード/g,"ペナルティーエリア").replace(/道|カート道路/g,"カート道").replace(/白杭/g,"OB 白杭").replace(/赤杭|赤線/g,"赤 ペナルティーエリア").replace(/黄杭|黄線/g,"黄 ペナルティーエリア").replace(/オッケー|OK/g,"コンシード OK").replace(/ニアレス[トド]?/g,"ニアレストポイント").replace(/アンプレ|アンプレアブル/g,"アンプレヤブル").replace(/暫定|打ち直し球/g,"暫定球").replace(/誤球|人の球|他人のボール/g,"他人の球 誤球").replace(/二球|２球/g,"2球").replace(/距離測定器|レーザー/g,"距離計").replace(/スロープ/g,"高低差");
 const compact=q.replace(/[\s、。・？?！!\/]/g,"");
 const words=q.split(/[\s、。・？?！!\/]+/).filter(w=>w.length>1);
 return competitionRules.map(r=>{
  const blob=[r.title,r.rule,r.category,r.cat,r.description,r.summary,r.procedure,r.action,r.penalty,r.keywords,Array.isArray(r.keys)?r.keys.join(" "):r.keys].filter(Boolean).join(" ");
  let score=words.reduce((n,w)=>n+(blob.includes(w)?2:0),0);
  const keys=String(r.keywords||(Array.isArray(r.keys)?r.keys.join(" "):r.keys)||"").split(/[\s、。・\/]+/).filter(Boolean);
  score+=keys.reduce((n,k)=>n+(compact.includes(k.replace(/\s/g,""))?4:0),0);
  const titleTokens=String(r.title||"").split(/[\s、。・（）()\/]+/).filter(k=>k.length>1);
  score+=titleTokens.reduce((n,k)=>n+(compact.includes(k)?5:0),0);
  if(compact.includes(String(r.title||"").replace(/[\s（）()・]/g,""))) score+=12;
  return {r,score};
 }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,4).map(x=>x.r);
}
function demoAnswer(text,hasPhoto){updateContext(text);const t=(text||"").toLowerCase();let body;
if(/(真っ二つ|粉々|バラバラ|複数.*(片|破片))/.test(text)){
 body='<div class="rule">規則4.2b / 球が複数片に壊れた</div><b>罰なし。そのストロークは数えません。</b><br>ストロークの結果、球が複数の破片に壊れた場合は、そのストロークを取り消し、別の球を直前のストロークを行った場所からプレーします。';
}else if(/球.*(壊|割)|ボール.*(壊|割)/.test(text)){
 body='<div class="rule">規則4.2b・4.2c / 球が壊れた</div><b>壊れ方で処置が変わります。</b><br><br>① <b>真っ二つ・複数の破片になった</b><br>→ 罰なし。そのストロークは数えず、別の球を直前の場所からプレーします。<br><br>② <b>切れ・ひびが入った</b><br>→ 位置をマークして確認し、切れ・ひびが確認できれば別の球へ交換できます。直前のストローク自体は数えます。<br><br>③ <b>擦り傷・塗装傷・変色・変形だけ</b><br>→ Rule 4.2cだけを理由に交換はできません。<br><br><b>どの状態ですか？「真っ二つ」「ひび」「変形」のように答えてください。</b>';
}else if(/球.*(ひび|切れ)|ボール.*(ひび|切れ)/.test(text)){
 body='<div class="rule">規則4.2c / 球が切れた・ひびが入った</div><b>位置をマークして確認できます。</b><br>直前のストローク中に切れ・ひびが生じたと合理的に考えられ、実際に確認できれば別の球へ取り替えられます。単なる擦り傷・塗装傷・変色・変形だけでは交換できません。';
}else if(/二度打ち|2度打ち|二回当た|2回当た|ダブルヒット/.test(text)){
 body='<div class="rule">規則10.1a / 偶然の二度打ち</div><b>追加の罰はありません。</b><br>1回のストローク中にクラブが偶然2回以上球に当たっても、<b>1ストロークだけ</b>数えます。球は止まった場所からそのままプレーします。<br><br>※動いている球へ故意にもう一度クラブを当てた場合は別の規則になるので、その場合は教えてください。';
}else if(/違う(コース|ホール)|別の(コース|ホール)|間違.*(コース|ホール)/.test(text)){
 body='<div class="rule">規則5・6 / 状況確認が必要</div><b>「違うコース／ホール」の意味で処置が変わります。</b><br><br>①競技ラウンド開始前に別コースや競技コースでプレーした<br>②ラウンド中に違うホールのティーから打った<br>③ホールのプレー順を間違えた<br><br><b>どれに近いですか？</b> また、ストロークプレーかマッチプレーかも分かれば教えてください。';
}else if(context.topic==="penalty"||/池|赤杭|黄杭|ペナルティ/.test(t)){if(context.color==="red"){body='<div class="rule">規則17.1d / 赤のペナルティーエリア</div><b>赤杭ですね。処置を絞れます。</b><br>救済を受ける場合は<b>1罰打</b>。球が最後に赤のペナルティーエリアの境界を横切った地点を基準に、①直前の場所から打ち直す、②その基点とホールを結ぶ後方線上の救済、③基点から2クラブレングス以内のラテラル救済、から選べます。<br><br>今回のように「池を一度越えてラフに着地した後、転がって池へ入った」場合も、<b>最後に池の境界を横切った地点</b>が基準です。'}else if(context.color==="yellow"){body='<div class="rule">規則17.1d / 黄のペナルティーエリア</div><b>黄杭ですね。</b><br>救済を受ける場合は<b>1罰打</b>。①直前の場所から打ち直す、または②球が最後に黄の境界を横切った地点を基準に後方線上の救済を選びます。赤杭にある2クラブレングスのラテラル救済は通常ありません。'}else{body='<div class="rule">規則17.1 / ペナルティーエリア</div><b>ここまでで分かっている内容：</b>池に入った状況ですね。<br><br><b>追加で必要なのは杭・線の色だけです。</b> 赤ですか、黄ですか？ 色で選べる救済方法が変わります。'}}else if(/ob|白杭|紛失|見つから/.test(t)){body='<div class="rule">規則18.2 / OB・紛失球</div><b>処置：</b>原則は1罰打を加え、直前のストロークを行った場所からプレーします。暫定球をプレーしている場合や、競技で特別なローカルルールが採用されている場合はその条件も確認します。'}else if(/カート|道路|修理地|水たまり/.test(t)){body='<div class="rule">規則16.1 / 異常なコース状態</div><b>確認：</b>球・スタンス・意図するスイング区域のどこが障害にかかっていますか？<br><br>救済対象なら、完全救済のニアレストポイントを基準に無罰救済を行います。'}else{
 const hits=searchRules(text);
 if(hits.length){
  const r=hits[0];
  body='<div class="rule">'+(r.rule?'規則'+r.rule:'競技規則')+' / '+r.title+'</div><b>関連する競技ルールが見つかりました。</b><br>'+(r.description||r.detail||'')+'<br><br><b>処置：</b>'+(r.procedure||r.how||'状況により追加確認が必要です。')+(r.penalty?'<br><br><b>罰・注意：</b>'+r.penalty:'');
 }else{
  body='<div class="rule">AI競技アシスタント</div><b>この表現だけでは規則を一意に特定できません。</b><br>'+(hasPhoto?'写真と説明をもとに、':'入力内容をもとに、')+'プレー形式、球の場所、何をした直後かなど、判定に必要な情報だけ確認します。';
 }
}bubble(body,"ai answer")}
document.getElementById("send").onclick=()=>{const text=input.value.trim(),hasPhoto=!!selected;if(!text&&!hasPhoto){input.focus();return}bubble((hasPhoto?'<span class="photo-mark">写真あり</span> ':'')+(text||"この写真の状況を確認して"),"me");input.value="";setTimeout(()=>demoAnswer(text,hasPhoto),180)};
input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();document.getElementById("send").click()}});
</script></body></html>
