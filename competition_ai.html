<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI競技アシスタント PRO</title><style>*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;height:100vh;display:flex;flex-direction:column}.head{background:#111;color:#fff;padding:18px 18px 15px}.head small{opacity:.7}.head h1{font-size:20px;margin:5px 0}.status{font-size:12px;color:#b9f6df}.chat{flex:1;overflow:auto;padding:18px;max-width:720px;width:100%;margin:auto}.bubble{max-width:88%;padding:13px 15px;border-radius:18px;margin:10px 0;line-height:1.55;font-size:15px}.ai{background:#fff;border:1px solid #e1e5e3}.me{background:#111;color:#fff;margin-left:auto}.quick{display:flex;gap:7px;overflow:auto;margin:12px 0}.quick button{white-space:nowrap;border:1px solid #cfd8d3;background:#fff;padding:9px 11px;border-radius:18px}.answer{border-left:5px solid #0a8a63}.rule{font-size:12px;color:#087f5b;font-weight:800}.composer{background:#fff;border-top:1px solid #ddd;padding:10px 12px 18px}.row{max-width:720px;margin:auto;display:flex;gap:8px}.mic{width:50px;height:50px;border:0;border-radius:50%;background:#0a8a63;color:#fff;font-size:22px}.input{flex:1;border:1px solid #ccc;border-radius:25px;padding:0 16px;font-size:16px}.send{border:0;border-radius:24px;background:#111;color:#fff;padding:0 17px;font-weight:800}.pro{font-size:11px;background:#ffd84d;color:#111;border-radius:8px;padding:3px 6px;margin-left:5px}</style></head><body><header class="head"><small onclick="history.back()">← 競技ゴルファー向け</small><h1>AI競技アシスタント <span class="pro">PRO</span></h1><div class="status">● 競技ルール専用アシスタント</div></header><main class="chat" id="chat"><div class="bubble ai">現在の状況をそのまま教えてください。<br>例：「ティーショットが右の赤杭を越えて池に入りました。どこから打てますか？」</div><div class="quick"><button>赤杭に入った</button><button>球が動いた</button><button>誤球を打った</button><button>OBかもしれない</button></div></main><footer class="composer"><div class="row"><button class="mic" id="mic">🎙</button><input class="input" id="input" placeholder="状況を入力、またはマイクで話す"><button class="send" id="send">送信</button></div></footer><script>
const input=document.getElementById("input"),chat=document.getElementById("chat");function add(t,c){const d=document.createElement("div");d.className="bubble "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function demo(v){add(v,"me");setTimeout(()=>{const d=document.createElement("div");d.className="bubble ai answer";d.innerHTML='<div class="rule">AI競技アシスタント / デモ</div><b>状況を確認しています。</b><br>本番版では競技ルールデータを参照し、必要なら追加質問をしたうえで「処置・罰・根拠規則・次にすること」を回答します。';chat.appendChild(d);chat.scrollTop=chat.scrollHeight},250)}document.getElementById("send").onclick=()=>{if(input.value.trim()){demo(input.value.trim());input.value=""}};document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>demo(b.textContent));document.getElementById("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("このブラウザでは音声入力のデモを利用できません");return}const r=new SR();r.lang="ja-JP";r.onresult=e=>{input.value=e.results[0][0].transcript};r.start()};</script></body></html>
