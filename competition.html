<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競技ゴルファー向け｜3タップゴルフ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fff9;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;padding-bottom:92px}.hero{background:#111;color:#fff;padding:38px 20px 28px;border-radius:0 0 38px 38px;text-align:center}.hero small{opacity:.72}.hero h1{margin:8px 0 4px;font-size:27px}.wrap{max-width:720px;margin:auto;padding:24px 20px}.search{width:100%;border:1px solid #ccc;border-radius:28px;padding:17px 20px;font-size:17px;background:#fff;box-shadow:0 5px 16px #0001}.primary{display:block;width:100%;margin:16px 0 22px;padding:17px;border:0;border-radius:25px;background:#111;color:#fff;font-size:18px;font-weight:800}.label{font-size:20px;color:#087f5b;margin:25px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #e3e8e5;border-radius:18px;padding:18px 13px;font-weight:750;text-align:left;min-height:76px;box-shadow:0 4px 12px #0000000a}.card span{display:block;font-size:12px;color:#777;margin-top:5px;font-weight:500}.notice{margin-top:24px;background:#edf8f3;border-left:5px solid #0a8a63;border-radius:14px;padding:14px;font-size:13px;line-height:1.6}.results{margin-top:12px}.result{background:#fff;border-radius:14px;padding:14px;margin:8px 0;border:1px solid #ddd}.back{display:inline-block;color:#087f5b;text-decoration:none;margin-bottom:16px;font-weight:700}</style></head><body>
<header class="hero"><small>3タップゴルフ / COMPETITION</small><h1>競技ゴルファー向け</h1><div>公式規則の考え方を、競技中に素早く確認</div></header>
<main class="wrap"><a class="back" href="index.html">← ホームへ戻る</a><input id="q" class="search" placeholder="競技ルールを検索…"><div id="results" class="results"></div><button class="primary" onclick="location.href='competition_rules.html'">競技ルール一覧</button><button class="primary" style="background:#0a8a63" onclick="location.href='competition_judge.html'">今すぐ裁定｜3タップで処置を確認</button><button class="primary" style="background:#fff;color:#111;border:2px solid #111" onclick="location.href='competition_ai.html'">🎙 AI競技アシスタント <span style="font-size:12px;background:#111;color:#fff;padding:4px 7px;border-radius:10px">PRO</span></button>
<h2 class="label">競技中によく確認する</h2><div class="grid">
<button class="card" data-q="救済">救済・ドロップ<span>ニヤレストポイント／救済エリア</span></button>
<button class="card" data-q="罰">罰・誤球<span>1罰打／一般の罰／誤球</span></button>
<button class="card" data-q="スコア">スコアカード<span>提出／訂正／失格に関わるケース</span></button>
<button class="card" data-q="プレー順">プレー順・マッチプレー<span>順番／コンセッション</span></button>
<button class="card" data-q="ローカル">ローカルルール<span>競技条件／E-5／プレー禁止区域</span></button>
<button class="card" data-q="用具">用具・アドバイス<span>クラブ／距離計／アドバイス</span></button></div>
<div class="notice"><b>競技での最終判断について</b><br>このページは公式規則を競技者向けに要約した確認ツールです。競技固有のローカルルール・競技の条件を優先し、紛議はその競技の委員会の裁定に従ってください。</div></main>
<script>const q=document.getElementById("q"),out=document.getElementById("results");function go(v){location.href="competition_rules.html?q="+encodeURIComponent(v)}q.addEventListener("keydown",e=>{if(e.key==="Enter"&&q.value.trim())go(q.value.trim())});document.querySelectorAll(".card").forEach(b=>b.onclick=()=>go(b.dataset.q));</script></body></html>
