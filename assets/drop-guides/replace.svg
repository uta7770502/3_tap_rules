<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390"><rect width="720" height="390" rx="24" fill="#fff"/><text x="28" y="45" font-family="sans-serif" font-size="28" font-weight="700">球を元の位置に戻す（リプレース）</text><path d="M0 245Q250 200 720 235V390H0Z" fill="#9fdc78"/><circle cx="310" cy="250" r="10" fill="#111"/><circle cx="455" cy="260" r="14" fill="#fff" stroke="#222" stroke-width="3"/><path d="M455 260Q390 210 315 245" fill="none" stroke="#e53935" stroke-width="5"/><rect x="250" y="105" width="300" height="80" rx="14" fill="#eef9f5"/><text x="270" y="136" font-family="sans-serif" font-size="18" font-weight="700">元の箇所が分かる → その箇所へ戻す</text><text x="270" y="164" font-family="sans-serif" font-size="16">必要な場合は先にマークしてから拾い上げる</text><text x="28" y="365" font-family="sans-serif" font-size="17">ドロップではなく「置いて戻す」処置です。</text></svg>