<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" rx="24" fill="#fff"/><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#075b4d">バンカー内の一時的な水</text><text x="28" y="78" font-family="sans-serif" font-size="18" fill="#222">無罰救済は原則としてバンカー内で受けます。</text><ellipse cx="355" cy="210" rx="270" ry="105" fill="#e9c878"/><path d="M130 220 Q240 160 360 220 T580 210" fill="#80d4f4"/><circle cx="270" cy="210" r="12" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="425" cy="180" r="9" fill="#111"/><path d="M280 205 Q345 170 415 180" stroke="#d33" stroke-width="5" fill="none"/><text x="390" y="155" font-family="sans-serif" font-size="16" font-weight="700">完全な救済の最も近い地点</text><rect x="30" y="326" width="660" height="54" rx="15" fill="#eef9f5"/><text x="46" y="359" font-family="sans-serif" font-size="16" fill="#222">バンカー外へ後方線上の救済を受ける選択肢は1罰打。</text></svg>