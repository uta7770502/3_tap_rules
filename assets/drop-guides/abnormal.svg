<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"><rect width="720" height="430" rx="24" fill="#fff"/><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#075b4d">異常なコース状態からの救済</text><text x="28" y="78" font-family="sans-serif" font-size="18">カート道・修理地・一時的な水などは原則無罰。</text><rect x="20" y="100" width="680" height="230" rx="20" fill="#bfe8ff"/><path d="M20 215Q250 160 700 205V330H20Z" fill="#83cf58"/><path d="M20 285L310 160L365 210L85 330Z" fill="#8e9398"/><g transform="translate(390 112) scale(.9)"><circle cx="48" cy="30" r="20" fill="#f2c49d"/><path d="M28 26q18-27 43-5l-5 10H30z" fill="#fff" stroke="#333" stroke-width="3"/><path d="M34 52q18-10 35 1l18 72H23z" fill="#087ec1"/><path d="M28 66L5 116M65 66L91 112" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M35 124L23 190M70 124L84 190" stroke="#e8d1ad" stroke-width="16" stroke-linecap="round"/></g><circle cx="350" cy="275" r="9" fill="#111"/><ellipse cx="475" cy="275" rx="80" ry="38" fill="#efaa9c" opacity=".72" stroke="#333" stroke-dasharray="7 6"/><path d="M360 275H550" stroke="#222" stroke-width="4"/><rect x="30" y="342" width="660" height="70" rx="15" fill="#eef9f5"/><text x="48" y="368" font-family="sans-serif" font-size="16" font-weight="700" fill="#08785e">①完全救済のニアレストポイントを確認</text><text x="48" y="394" font-family="sans-serif" font-size="16">②1クラブレングス以内・ホールに近づかない場所へドロップ</text></svg>