<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"><rect width="720" height="430" rx="24" fill="#fff"/><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#075b4d">異常なコース状態からの救済</text><text x="28" y="78" font-family="sans-serif" font-size="18" fill="#222">カート道・修理地・一時的な水などから、原則無罰で救済できます。</text><rect x="20" y="100" width="680" height="235" rx="20" fill="#dff3ff"/><path d="M20 230Q210 170 700 220V335H20Z" fill="#9bd86e"/><path d="M360 215l250-80 45 55-250 85z" fill="#9b9b9b"/><g transform="translate(120 112)"><circle cx="48" cy="30" r="20" fill="#f2c49d"/><path d="M28 26q18-27 43-5l-5 10H30z" fill="#fff" stroke="#333" stroke-width="3"/><path d="M34 52q18-10 35 1l18 72H23z" fill="#087ec1"/><path d="M28 66L5 116" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M65 66L91 112" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M35 124L23 190M70 124L84 190" stroke="#e8d1ad" stroke-width="16" stroke-linecap="round"/><path d="M7 190h35M70 190h36" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M90 108L112 188" stroke="#333" stroke-width="5"/></g><circle cx="365" cy="275" r="10" fill="#111"/><ellipse cx="455" cy="275" rx="82" ry="42" fill="#f2c3ae" opacity=".85" stroke="#333" stroke-dasharray="7 6"/><path d="M375 275H535" stroke="#222" stroke-width="3"/><text x="326" y="315" font-family="sans-serif" font-size="16" font-weight="700">完全に障害がなくなる一番近い場所</text><rect x="32" y="350" width="656" height="58" rx="15" fill="#eef9f5"/><text x="48" y="375" font-family="sans-serif" font-size="16" font-weight="700" fill="#08785e">①基準点を決める　②ホールに近づかない1クラブレングス以内にドロップ</text><text x="48" y="397" font-family="sans-serif" font-size="15" fill="#222">救済後もカート道などの障害が残らない場所を選びます。</text></svg>