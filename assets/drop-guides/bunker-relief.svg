<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390"><rect width="720" height="390" rx="24" fill="#fff"/><text x="28" y="45" font-family="sans-serif" font-size="28" font-weight="700">バンカー内での救済</text><path d="M0 230Q250 180 720 220V390H0Z" fill="#9fdc78"/><ellipse cx="390" cy="260" rx="170" ry="80" fill="#e8d19b"/><circle cx="390" cy="245" r="11" fill="#fff" stroke="#222" stroke-width="3"/><path d="M390 245L300 205M390 245L485 205" stroke="#222" stroke-width="4" stroke-dasharray="9 7"/><rect x="235" y="92" width="335" height="82" rx="14" fill="#eef9f5"/><text x="255" y="122" font-family="sans-serif" font-size="18" font-weight="700">救済方法によって「バンカー内／外」が違う</text><text x="255" y="150" font-family="sans-serif" font-size="16">罰打も異なるため、本文の処置方法を確認</text><text x="28" y="365" font-family="sans-serif" font-size="17">アンプレヤブルと異常なコース状態では選択肢が異なります。</text></svg>