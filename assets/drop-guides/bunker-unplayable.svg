<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"><rect width="720" height="430" rx="24" fill="#fff"/><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#075b4d">バンカーでアンプレヤブル</text><text x="28" y="78" font-family="sans-serif" font-size="18" fill="#222">バンカーでは4つの選択肢があります。</text><rect x="24" y="105" width="672" height="190" rx="22" fill="#f5dfaa"/><ellipse cx="365" cy="205" rx="190" ry="70" fill="#e9c878"/><circle cx="360" cy="210" r="12" fill="#fff" stroke="#222" stroke-width="3"/><path d="M360 210 L255 155" stroke="#d33" stroke-width="5"/><path d="M360 210 L360 125" stroke="#222" stroke-width="4" stroke-dasharray="9 7"/><path d="M360 210 L470 210" stroke="#d33" stroke-width="5"/><path d="M360 210 L570 110" stroke="#6b2ca5" stroke-width="5"/><text x="65" y="142" font-family="sans-serif" font-size="16" font-weight="700">①前の場所へ戻る</text><text x="278" y="118" font-family="sans-serif" font-size="16" font-weight="700">②後方線上（バンカー内）</text><text x="450" y="235" font-family="sans-serif" font-size="16" font-weight="700">③横2クラブ（バンカー内）</text><text x="475" y="98" font-family="sans-serif" font-size="16" font-weight="700" fill="#6b2ca5">④後方線上でバンカー外</text><rect x="24" y="315" width="672" height="88" rx="18" fill="#eef9f5"/><text x="42" y="346" font-family="sans-serif" font-size="18" font-weight="700" fill="#08785e">罰打</text><text x="42" y="375" font-family="sans-serif" font-size="17" fill="#222">①〜③は1罰打。④でバンカー外へ出す場合は合計2罰打。</text></svg>