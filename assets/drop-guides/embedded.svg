<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"><rect width="720" height="430" rx="24" fill="#fff"/><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#075b4d">地面にくい込んだ球からの救済</text><text x="28" y="78" font-family="sans-serif" font-size="18" fill="#222">ジェネラルエリアで条件を満たせば無罰救済。</text><rect x="20" y="100" width="680" height="230" rx="20" fill="#dff3ff"/><path d="M20 220Q240 160 700 210V330H20Z" fill="#9bd86e"/><g transform="translate(120 112)"><circle cx="48" cy="30" r="20" fill="#f2c49d"/><path d="M28 26q18-27 43-5l-5 10H30z" fill="#fff" stroke="#333" stroke-width="3"/><path d="M34 52q18-10 35 1l18 72H23z" fill="#087ec1"/><path d="M28 66L5 116" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M65 66L91 112" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M35 124L23 190M70 124L84 190" stroke="#e8d1ad" stroke-width="16" stroke-linecap="round"/><path d="M7 190h35M70 190h36" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M90 108L112 188" stroke="#333" stroke-width="5"/></g><circle cx="390" cy="260" r="16" fill="#fff" stroke="#333" stroke-width="3"/><path d="M382 270q10 15 20 0" fill="#775a3c"/><circle cx="430" cy="262" r="9" fill="#111"/><ellipse cx="490" cy="263" rx="65" ry="34" fill="#f2c3ae" opacity=".85" stroke="#333" stroke-dasharray="7 6"/><text x="360" y="310" font-family="sans-serif" font-size="15" font-weight="700">球の真後ろを基準点 → 1クラブレングス以内</text><rect x="32" y="350" width="656" height="58" rx="15" fill="#eef9f5"/><text x="48" y="385" font-family="sans-serif" font-size="16" font-weight="700" fill="#08785e">球を拾い上げ、基準点からホールに近づかない救済エリアへドロップ</text></svg>