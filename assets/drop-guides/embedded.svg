<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"><rect width="720" height="430" rx="24" fill="#fff"/><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#075b4d">地面にくい込んだ球からの救済</text><text x="28" y="78" font-family="sans-serif" font-size="18">ジェネラルエリアで条件を満たせば無罰救済。</text><rect x="20" y="100" width="680" height="230" rx="20" fill="#bfe8ff"/><path d="M20 210Q250 160 700 205V330H20Z" fill="#83cf58"/><g transform="translate(250 108)"><circle cx="48" cy="30" r="20" fill="#f2c49d"/><path d="M28 26q18-27 43-5l-5 10H30z" fill="#fff" stroke="#333" stroke-width="3"/><path d="M34 52q18-10 35 1l18 72H23z" fill="#087ec1"/><path d="M28 66L5 116M65 66L91 112" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M35 124L23 190M70 124L84 190" stroke="#e8d1ad" stroke-width="16" stroke-linecap="round"/></g><circle cx="410" cy="275" r="15" fill="#fff" stroke="#333" stroke-width="3"/><path d="M400 284q10 14 20 0" fill="#765137"/><circle cx="445" cy="278" r="8" fill="#111"/><ellipse cx="525" cy="278" rx="68" ry="34" fill="#efaa9c" opacity=".72" stroke="#333" stroke-dasharray="7 6"/><rect x="30" y="342" width="660" height="70" rx="15" fill="#eef9f5"/><text x="48" y="368" font-family="sans-serif" font-size="16" font-weight="700" fill="#08785e">①球がくい込んでいることを確認　②球の真後ろを基準点にする</text><text x="48" y="394" font-family="sans-serif" font-size="16">③1クラブレングス以内・ホールに近づかない場所へドロップ</text></svg>