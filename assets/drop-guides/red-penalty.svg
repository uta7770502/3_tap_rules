<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><rect width="720" height="420" rx="24" fill="#fff"/><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#b92727">赤杭のペナルティーエリア</text><text x="28" y="78" font-family="sans-serif" font-size="18" fill="#222">救済を受ける場合は1罰打。3つの選択肢があります。</text><path d="M0 210Q210 155 430 195V305H0Z" fill="#9fdc78"/><path d="M430 110H720V305H430Z" fill="#65c7ee"/><line x1="430" y1="115" x2="430" y2="300" stroke="#e53935" stroke-width="8"/><circle cx="418" cy="205" r="11" fill="#e53935" stroke="#fff" stroke-width="3"/><path d="M418 205 Q340 160 260 185" fill="none" stroke="#222" stroke-width="4" stroke-dasharray="9 7"/><text x="215" y="150" font-family="sans-serif" font-size="16" font-weight="700">②後方線上</text><path d="M418 205 Q370 255 330 285" fill="none" stroke="#d33" stroke-width="5"/><ellipse cx="330" cy="286" rx="80" ry="35" fill="#f4b7aa" opacity=".8"/><text x="235" y="340" font-family="sans-serif" font-size="16" font-weight="700">③基準点から横2クラブ以内</text><text x="45" y="382" font-family="sans-serif" font-size="16" font-weight="700">①前の場所から打ち直す方法も選べます。</text></svg>