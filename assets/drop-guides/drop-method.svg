<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"><rect width="720" height="430" rx="24" fill="#fff"/><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#075b4d">正しいドロップの方法</text><text x="28" y="78" font-family="sans-serif" font-size="18" fill="#222">立った状態で、膝の高さから真下へ落とします。</text><rect x="20" y="100" width="680" height="230" rx="20" fill="#dff3ff"/><path d="M20 250Q250 205 700 245V330H20Z" fill="#9bd86e"/><g transform="translate(120 112)"><circle cx="48" cy="30" r="20" fill="#f2c49d"/><path d="M28 26q18-27 43-5l-5 10H30z" fill="#fff" stroke="#333" stroke-width="3"/><path d="M34 52q18-10 35 1l18 72H23z" fill="#087ec1"/><path d="M28 66L5 116" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M65 66L91 112" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M35 124L23 190M70 124L84 190" stroke="#e8d1ad" stroke-width="16" stroke-linecap="round"/><path d="M7 190h35M70 190h36" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M90 108L112 188" stroke="#333" stroke-width="5"/></g><circle cx="225" cy="210" r="11" fill="#fff" stroke="#333" stroke-width="3"/><path d="M225 225V290" stroke="#e53935" stroke-width="5" stroke-dasharray="8 6"/><path d="M215 280l10 14 10-14" fill="none" stroke="#e53935" stroke-width="5"/><ellipse cx="225" cy="300" rx="80" ry="27" fill="#f2c3ae" opacity=".85" stroke="#333" stroke-dasharray="7 6"/><text x="300" y="205" font-family="sans-serif" font-size="19" font-weight="700">膝の高さ</text><text x="300" y="235" font-family="sans-serif" font-size="17">投げたり回転をかけたりせず、まっすぐ落とす</text><rect x="32" y="350" width="656" height="58" rx="15" fill="#eef9f5"/><text x="48" y="385" font-family="sans-serif" font-size="16" font-weight="700" fill="#08785e">球は救済エリア内に落ち、救済エリア内に止まる必要があります。</text></svg>