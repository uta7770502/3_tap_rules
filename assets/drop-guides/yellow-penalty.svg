<svg data-approved-style="20260921" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" rx="24" fill="#fff"/><g data-style="unified-golfer" transform="translate(95 88) scale(.72)"><circle cx="48" cy="30" r="20" fill="#f2c49d"/><path d="M28 26q18-27 43-5l-5 10H30z" fill="#fff" stroke="#333" stroke-width="3"/><path d="M34 52q18-10 35 1l18 72H23z" fill="#087ec1"/><path d="M28 66L5 116M65 66L91 112" stroke="#f2c49d" stroke-width="13" stroke-linecap="round"/><path d="M35 124L23 190M70 124L84 190" stroke="#e8d1ad" stroke-width="16" stroke-linecap="round"/><path d="M7 190h35M70 190h36" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M90 108L112 188" stroke="#333" stroke-width="5"/></g><text x="28" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#8a6b00">黄杭のペナルティーエリア</text><text x="28" y="78" font-family="sans-serif" font-size="18" fill="#222">救済を受ける場合は1罰打。主な選択肢は2つです。</text><path d="M0 205Q220 150 430 195V300H0Z" fill="#9fdc78"/><path d="M430 110H720V300H430Z" fill="#65c7ee"/><line x1="430" y1="115" x2="430" y2="295" stroke="#f2c500" stroke-width="8"/><circle cx="418" cy="205" r="11" fill="#f2c500" stroke="#fff" stroke-width="3"/><path d="M418 205 Q335 160 250 185" fill="none" stroke="#222" stroke-width="4" stroke-dasharray="9 7"/><text x="210" y="150" font-family="sans-serif" font-size="17" font-weight="700">②後方線上</text><path d="M250 230 Q155 255 80 245" fill="none" stroke="#d33" stroke-width="5"/><text x="55" y="280" font-family="sans-serif" font-size="17" font-weight="700">①前の場所から打ち直し</text><rect x="28" y="320" width="664" height="58" rx="15" fill="#fff6cf"/><text x="45" y="355" font-family="sans-serif" font-size="17" font-weight="700" fill="#6f5800">赤杭にある「基準点から横2クラブ」の救済は、黄杭にはありません。</text></svg>