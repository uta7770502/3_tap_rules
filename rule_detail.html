<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3タップルールズ</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body{background:#f9fff9;font-family:"Helvetica",sans-serif;margin:0;padding-bottom:90px}
    header{background:#00bfa5;color:#fff;text-align:center;padding:16px 0;font-size:24px;font-weight:bold;border-bottom-left-radius:25px;border-bottom-right-radius:25px}
    .title{font-size:26px;font-weight:800;color:#0f8a62;margin:12px 16px 0}
    .sec{border-radius:18px;margin:14px 16px;padding:16px 16px;border:1px solid #e6e6e6;box-shadow:0 4px 10px rgba(0,0,0,.06)}
    .sec.how{background:#e8fff3;border-left:8px solid #11a371}
    .sec.pen{background:#ffe9e9;border-left:8px solid #e65757}
    .sec h2{margin:0 0 10px;font-size:20px;color:#0a8a63}
    .sec.pen h2{color:#c31313}
    .sec p{margin:8px 0 0;font-size:17px;line-height:1.8;color:#222}
    .penalty-red{color:#e60000;font-weight:800}
    .penalty-green{color:#009900;font-weight:800}
    .bottom-nav{position:fixed;left:0;bottom:0;width:100%;height:70px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.05);z-index:1000}
    .bottom-nav a{display:flex;align-items:center;justify-content:center;text-decoration:none;height:100%;width:33.33%}
    .bottom-nav img{width:50px;height:auto;display:block}
    .back-btn{display:block;width:220px;margin:16px auto 6px;background:#FFD84D;color:#00997f;font-weight:800;text-align:center;border-radius:40px;padding:12px 16px;text-decoration:none;box-shadow:0 6px 14px rgba(0,0,0,.12)}
    .drop-guide{background:#fff;border-left:8px solid #1f8fd1;padding:12px}
    .drop-guide h2{color:#1475b0;margin:2px 4px 10px}
    .drop-guide img{display:block;width:auto;max-width:100%;height:auto;margin:0 auto;border-radius:12px;image-rendering:auto}
    .drop-guide-viewport{overflow-x:auto;-webkit-overflow-scrolling:touch;text-align:center}
    @media(max-width:430px){.drop-guide{padding:12px 10px}.drop-guide img{width:560px;max-width:none}.drop-guide-viewport{margin:0 -2px;padding-bottom:4px}}
    .drop-guide-note{font-size:13px!important;color:#666!important;line-height:1.55!important;margin:10px 4px 0!important}
    #dropGuideImage{cursor:zoom-in}
    .image-modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:54px 12px 24px;box-sizing:border-box}
    .image-modal.open{display:flex}
    .image-modal-scroll{width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center}
    .image-modal img{display:block;width:auto;height:auto;max-width:none;min-width:900px;background:#fff}
    .image-modal-close{position:fixed;right:14px;top:14px;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#111;font-size:28px;line-height:40px;z-index:10000}
    @media(max-width:430px){.image-modal img{min-width:900px}}
  </style>
</head>
<body>
  <header>3タップルールズ</header>

  <h1 id="ruleTitle" class="title"></h1>

  <section class="sec how">
    <h2 id="howHeading">まず、こうすればOK</h2>
    <div id="howBody"></div>
  </section>

  <section id="dropGuide" class="sec drop-guide" hidden>
    <h2>ドロップの処置を図で確認</h2>
    <div class="drop-guide-viewport"><img id="dropGuideImage" alt="ドロップの処置方法を示す図" role="button" tabindex="0" aria-label="タップして図を拡大"></div>
    <p class="drop-guide-note">※図をタップすると大きく表示できます。実際の処置は、上の「処置方法」を確認してください。</p>
  </section>

  <div id="imageModal" class="image-modal" aria-hidden="true">
    <button id="imageModalClose" class="image-modal-close" aria-label="閉じる">×</button>
    <div class="image-modal-scroll"><img id="imageModalImg" alt="ドロップの処置方法を拡大表示"></div>
  </div>

  <section class="sec pen">
    <h2 id="penHeading">罰はある？</h2>
    <div id="penBody"></div>
  </section>

  <a id="backBtn" class="back-btn" href="rules.html">ルール詳細へ戻る</a>
<!-- ★ お気に入りボタン -->
<div class="favorite-area">
  <button id="favoriteBtn" class="favorite-btn">
    お気に入りに追加
  </button>
</div>
  <nav class="bottom-nav">
    <a href="index.html"><img src="home-icon.png" alt="ホーム"></a>
    <a href="rules.html"><img src="book-icon.png" alt="ルール一覧"></a>
    <a href="favorites.html"><img src="star-icon.png" alt="お気に入り"></a>
  </nav>

<script>
  const guideImg = document.getElementById("dropGuideImage");
  const imageModal = document.getElementById("imageModal");
  const imageModalImg = document.getElementById("imageModalImg");
  const imageModalClose = document.getElementById("imageModalClose");
  function openGuideModal(){
    if(!guideImg.src) return;
    imageModalImg.src = guideImg.src;
    imageModal.classList.add("open");
    imageModal.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
  }
  function closeGuideModal(){
    imageModal.classList.remove("open");
    imageModal.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
  }
  guideImg.addEventListener("click", openGuideModal);
  guideImg.addEventListener("keydown", e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openGuideModal();}});
  imageModalClose.addEventListener("click", closeGuideModal);
  imageModal.addEventListener("click", e=>{if(e.target===imageModal||e.target.classList.contains("image-modal-scroll"))closeGuideModal();});

  // 🔴 赤・緑ハイライト
  function highlightPenalty(text){
    if(!text) return "";
    return text
      .replace(/([0-9]+打罰|一打罰|二打罰|三打罰)/g, "<span class='penalty-red'>$1</span>")
      .replace(/(無罰|0打罰)/g, "<span class='penalty-green'>$1</span>");
  }

  // JSONの監査済みペナルティをそのまま表示する

  // 🧠 JSON取得と表示処理
  (async () => {
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    const titleEl = document.getElementById("ruleTitle");
    const howEl   = document.getElementById("howBody");
    const penEl   = document.getElementById("penBody");
    const backBtn = document.getElementById("backBtn");

    try {
      const res = await fetch("rules.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("fetch failed");
      const rules = await res.json();
      const rule = rules.find(r => String(r.id) === String(id));
      if (!rule) throw new Error("rule not found id=" + id);

      titleEl.textContent = rule.title || "ルール";

      if (rule.category === "クラブ") {
        document.getElementById("howHeading").textContent = "まず、こう選べばOK";
        document.getElementById("penHeading").textContent = "覚えておくポイント";
        document.querySelector(".sec.pen").style.borderColor = "#cfe9df";
        document.querySelector(".sec.pen h2").style.color = "#0a8a63";
      }

      let how = rule.procedure || rule.how || rule.correct || "";
      let pen = rule.penalty || rule.penalties || "";


      const finalHow = how || "この場面での対応方法を確認できませんでした。";
      const finalPen = pen || "この場面の罰について確認できませんでした。";

      howEl.innerHTML = highlightPenalty(finalHow).split(/\n+/).map(p=>`<p>${p}</p>`).join("");
      penEl.innerHTML = highlightPenalty(finalPen).split(/\n+/).map(p=>`<p>${p}</p>`).join("");

      // ドロップ処置を含むルールだけ、承認済みの共通イラストを表示
      const dropText = [rule.title, rule.description, rule.detail, rule.procedure, rule.how, rule.correct]
        .filter(Boolean).join(" ");
      if (dropText.includes("ドロップ")) {
        try {
          const imageRes = await fetch("assets/drop-treatment-guide.b64?v=" + Date.now(), { cache: "no-store" });
          if (imageRes.ok) {
            const imageBase64 = (await imageRes.text()).trim();
            document.getElementById("dropGuideImage").src = "data:image/jpeg;base64," + imageBase64;
            document.getElementById("dropGuide").hidden = false;
          }
        } catch (imageError) {
          console.warn("drop guide image load failed", imageError);
        }
      }

      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (document.referrer) history.back();
        else location.href = 'rules.html';
      });

    } catch (e) {
      console.error("❌ rule_detail error:", e);
      titleEl.textContent = "内容を読み込めませんでした";
      howEl.innerHTML = "<p>処置方法の情報が見つかりません。</p>";
      penEl.innerHTML = "<p>ペナルティの情報が見つかりません。</p>";
    }
  })();
</script>
  <script>
  const favBtn = document.getElementById("favoriteBtn");
  const params = new URLSearchParams(location.search);
  const ruleId = Number(params.get("id"));

  const KEY = "favorites";

  function loadFavs() {
    try {
      const v = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(v) ? v.map(Number).filter(Boolean) : [];
    } catch {
      return [];
    }
  }

  function saveFavs(favs) {
    localStorage.setItem(KEY, JSON.stringify(favs));
  }

  function setBtn(isFav) {
    favBtn.textContent = isFav ? "★ お気に入り登録済み" : "お気に入りに追加";
  }

  if (favBtn && ruleId) {
    let favs = loadFavs();
    setBtn(favs.includes(ruleId));

    favBtn.addEventListener("click", () => {
      favs = loadFavs(); // 念のため最新を読む

      if (favs.includes(ruleId)) {
        // 既にある → 削除
        favs = favs.filter((x) => x !== ruleId);
        saveFavs(favs);
        setBtn(false);
      } else {
        // ない → 追加
        favs.push(ruleId);
        saveFavs(favs);
        setBtn(true);
      }
    });
  }
</script>
</body>
</html>
