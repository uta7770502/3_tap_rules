<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競技ルール一覧</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fff9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17202a;padding-bottom:70px}header{background:#111;color:#fff;padding:24px 20px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:25px}.wrap{padding:20px;max-width:720px;margin:auto}.back{color:#087f5b;text-decoration:none;font-weight:700}.search{width:100%;margin:18px 0 10px;padding:16px 18px;border:1px solid #ccc;border-radius:25px;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.chip{border:0;background:#e9f6f1;padding:9px 13px;border-radius:18px;white-space:nowrap;font-weight:700}.item{background:#fff;border:1px solid #e2e7e4;border-radius:17px;padding:16px;margin:10px 0;box-shadow:0 3px 12px #00000008}.rule{font-size:12px;color:#087f5b;font-weight:800}.item h2{font-size:18px;margin:5px 0}.item p{font-size:14px;color:#555;margin:0;line-height:1.55}</style></head><body><header><h1>競技ルール一覧</h1><div style="font-size:12px;opacity:.75;margin-top:5px">規則1〜25・定義・ローカルルール・委員会手続</div></header><main class="wrap"><a class="back" href="competition.html">← 競技ゴルファー向け</a><input id="q" class="search" placeholder="規則・状況を検索…"><div class="chips"><button class="chip" data-q="">すべて</button><button class="chip" data-q="救済">救済</button><button class="chip" data-q="罰">罰</button><button class="chip" data-q="OB">OB</button><button class="chip" data-q="誤球">誤球</button><button class="chip" data-q="スコア">スコア</button><button class="chip" data-q="委員会">裁定</button><button class="chip" data-q="定義">定義</button><button class="chip" data-q="ローカルルール">ローカルルール</button></div><div id="list"></div></main><script>let rules=[];const q=document.getElementById("q"),list=document.getElementById("list");function draw(){const v=q.value.trim().toLowerCase();const a=rules.filter(r=>!v||[r.title,r.summary,r.action,r.penalty,r.cat,r.rule,...r.keys].join(" ").toLowerCase().includes(v));list.innerHTML=a.map(r=>`<article class="item" onclick="location.href='competition_rule.html?id=${r.id}'"><div class="rule">規則 ${r.rule} ・ ${r.cat}</div><h2>${r.title}</h2><p>${r.summary}</p></article>`).join("")||"<p>該当する競技ルールがありません。</p>"}fetch("competition_rules.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{rules=d;const p=new URLSearchParams(location.search).get("q");if(p)q.value=p;draw()});q.oninput=draw;document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{q.value=b.dataset.q;draw()});</script></body></html>
