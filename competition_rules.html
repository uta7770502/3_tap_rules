<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競技ルール一覧</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fff9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17202a;padding-bottom:70px}header{background:#111;color:#fff;padding:24px 20px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:25px}.wrap{padding:20px;max-width:720px;margin:auto}.back{color:#087f5b;text-decoration:none;font-weight:700}.search{width:100%;margin:18px 0 10px;padding:16px 18px;border:1px solid #ccc;border-radius:25px;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.chip{border:0;background:#e9f6f1;padding:9px 13px;border-radius:18px;white-space:nowrap;font-weight:700}.item{background:#fff;border:1px solid #e2e7e4;border-radius:17px;padding:16px;margin:10px 0;box-shadow:0 3px 12px #00000008}.rule{font-size:12px;color:#087f5b;font-weight:800}.item h2{font-size:18px;margin:5px 0}.item p{font-size:14px;color:#555;margin:0;line-height:1.55}.navTitle{font-size:13px;font-weight:800;margin:22px 2px 9px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button,.rulesGrid button{border:1px solid #dfe9e4;background:#fff;border-radius:15px;padding:12px 7px;font-weight:750;font-size:13px}.rulesGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.guide button{border:0;background:#e9f6f1;border-radius:15px;padding:12px 8px;font-weight:750}.count{font-size:12px;color:#68716d;margin:12px 2px}.active{outline:2px solid #0a8a63!important;background:#effaf5!important}@media(max-width:390px){.quick{grid-template-columns:repeat(2,1fr)}.rulesGrid{grid-template-columns:repeat(5,1fr)}}</style></head><body><header><h1>競技ルール一覧</h1><div style="font-size:12px;opacity:.75;margin-top:5px">規則1〜25・定義・ローカルルール・委員会手続</div></header><main class="wrap"><a class="back" href="competition.html">← 競技ゴルファー向け</a><input id="q" class="search" placeholder="規則・状況を検索…"><div class="navTitle">状況から探す</div><div class="quick" id="quick">
<button data-filter="救済">救済</button><button data-filter="OB 紛失 暫定球">OB・紛失</button><button data-filter="ペナルティーエリア 赤杭 黄杭">ペナルティーエリア</button>
<button data-filter="バンカー">バンカー</button><button data-filter="パッティンググリーン グリーン">グリーン</button><button data-filter="誤球">誤球</button>
<button data-filter="ドロップ">ドロップ</button><button data-filter="球が動">球が動いた</button><button data-filter="用具 クラブ">用具・クラブ</button>
<button data-filter="スコア">スコア</button><button data-filter="アドバイス キャディー">アドバイス</button><button data-filter="プレー順">プレー順</button></div>
<div class="navTitle">Rule番号から探す</div><div class="rulesGrid" id="ruleGrid"><button data-rule="1">1</button><button data-rule="2">2</button><button data-rule="3">3</button><button data-rule="4">4</button><button data-rule="5">5</button><button data-rule="6">6</button><button data-rule="7">7</button><button data-rule="8">8</button><button data-rule="9">9</button><button data-rule="10">10</button><button data-rule="11">11</button><button data-rule="12">12</button><button data-rule="13">13</button><button data-rule="14">14</button><button data-rule="15">15</button><button data-rule="16">16</button><button data-rule="17">17</button><button data-rule="18">18</button><button data-rule="19">19</button><button data-rule="20">20</button><button data-rule="21">21</button><button data-rule="22">22</button><button data-rule="23">23</button><button data-rule="24">24</button><button data-rule="25">25</button></div>
<div class="navTitle">公式ガイド</div><div class="guide"><button data-filter="定義">定義</button><button data-filter="Clarification">Clarifications</button><button data-filter="MLR ローカルルール">MLR・ローカルルール</button><button data-filter="委員会">委員会手続</button></div>
<div class="count" id="count"></div><div id="list"></div></main><script>
let rules=[],mode={type:"all",value:""};const q=document.getElementById("q"),list=document.getElementById("list"),count=document.getElementById("count");
function normalize(r){
  const keys=Array.isArray(r.keys)?r.keys:String(r.keywords||"").split(/[\s、,]+/).filter(Boolean);
  return {...r,summary:r.summary||r.description||"",action:r.action||r.procedure||"",cat:r.cat||r.category||"",keys};
}
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function textOf(r){return [r.title,r.summary,r.action,r.penalty,r.cat,r.rule,...r.keys].join(" ").toLowerCase();}
function draw(){
  const v=q.value.trim().toLowerCase();
  let a=rules.filter(r=>!v||textOf(r).includes(v));
  if(!v&&mode.type==="rule")a=a.filter(r=>parseInt(String(r.rule),10)===Number(mode.value));
  if(!v&&mode.type==="filter"){const terms=mode.value.toLowerCase().split(/\s+/);a=a.filter(r=>terms.some(t=>textOf(r).includes(t)));}
  count.textContent=a.length+"件表示 / 全"+rules.length+"件";
  list.innerHTML=a.map(r=>`<article class="item" role="button" tabindex="0" data-id="${esc(r.id)}"><div class="rule">規則 ${esc(r.rule)} ・ ${esc(r.cat)}</div><h2>${esc(r.title)}</h2><p>${esc(r.summary)}</p></article>`).join("")||"<p>該当する競技ルールがありません。</p>";
  list.querySelectorAll(".item").forEach(el=>{const go=()=>location.href="competition_rule.html?id="+encodeURIComponent(el.dataset.id);el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")go();};});
}
fetch("competition_rules.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{rules=d.map(normalize);const p=new URLSearchParams(location.search).get("q");if(p)q.value=p;draw()}).catch(()=>{list.innerHTML="<p>競技ルールを読み込めませんでした。</p>"});
function activate(el){document.querySelectorAll("[data-filter],[data-rule]").forEach(x=>x.classList.remove("active"));if(el)el.classList.add("active");}
q.oninput=()=>{mode={type:"all",value:""};activate(null);draw();};
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{q.value="";mode={type:"filter",value:b.dataset.filter};activate(b);draw();});
document.querySelectorAll("[data-rule]").forEach(b=>b.onclick=()=>{q.value="";mode={type:"rule",value:b.dataset.rule};activate(b);draw();});
</script></body></html>
